PLG_SYSTEM_JOOA11Y_FIELD_CHECK_ROOT_DESC="Сайттың нақты аймағын мақсат ету үшін бір селектор енгізіңіз. Әдепкі параметр — <strong>main</strong> бағдары (landmark). Бағдарлардың балама нұсқалары — кластар, элементтер немесе ARIA рөлдері (мысалы, #main-content, .main, [role='main']). Бүкіл бетті тексеру үшін <strong>body</strong> енгізіңіз."
PLG_SYSTEM_JOOA11Y_FIELD_CHECKS="Тексеруді өшіру"
PLG_SYSTEM_JOOA11Y_FIELD_CHECKS_DESC="Нақты тексерулерді кілт атауы бойынша өшіріңіз. <a href=\"https://sa11y.netlify.app/plugins/joomla/#turn-off-checks\" target=\"_blank\" rel=\"noopener noreferrer\">Тексерулерді қалай өшіруге болатынын</a> біліңіз."
PLG_SYSTEM_JOOA11Y_FIELD_CONTAINER_IGNORE="Аймақтарды елемеу"
PLG_SYSTEM_JOOA11Y_FIELD_CONTAINER_IGNORE_DESC="Контент контейнеріндегі нақты аймақтарды елемеңіз. Кластарды немесе элементтерді үтірмен бөліңіз (мысалы, #ignore, .ignore)."
PLG_SYSTEM_JOOA11Y_FIELD_EXTRA_PROPS="Қосымша қасиеттер"
PLG_SYSTEM_JOOA11Y_FIELD_EXTRA_PROPS_DESC="Баптау үшін қосымша қасиеттерді беріңіз. <a href=\"https://sa11y.netlify.app/plugins/joomla/#extra-properties\" target=\"_blank\" rel=\"noopener noreferrer\">Қосымша қасиеттерді қалай қосуға болатынын</a> біліңіз."
PLG_SYSTEM_JOOA11Y_FIELD_READABILITY_ROOT="Оқылымдылықты тексеру аймағы"
PLG_SYSTEM_JOOA11Y_FIELD_READABILITY_ROOT_DESC="Оқылымдылық тексерілетін беттегі бағдар (landmark). Әдепкі параметр — <strong>main</strong> бағдары."
PLG_SYSTEM_JOOA11Y_FIELD_SHOW_ALWAYS="Әрқашан көрсету"
PLG_SYSTEM_JOOA11Y_FIELD_SHOW_ALWAYS_DESC="Қолжетімділік тексергішін барлық беттерде жүктеу. Бұл сайтты әзірлеу кезінде пайдалы, бірақ сайт жұмыс істеп тұрғанда қосулы қалдыруға болмайды."
PLG_SYSTEM_JOOA11Y_KEY="Тақырыбы"
PLG_SYSTEM_JOOA11Y_VALUE="Мәні"
PLG_SYSTEM_JOOA11Y_XML_DESCRIPTION="Joomla қолжетімділік тексергіші жиі кездесетін қолжетімділік және ыңғайлылық мәселелерін көрнекі түрде бөлектейді. Контент авторларына бағытталған плагин қателер мен ескертулерді анықтап, оларды қалай түзету керектігі туралы нұсқау береді. Бұл плагин сайтыңызға толық талдау жасамайтынын және сайттың қолжетімділігін автоматты түрде қамтамасыз етпейтінін ескеріңіз. Сайтыңыз қолжетімділік стандарттарына сәйкес болуы үшін табиғи түрде қолжетімді шаблонды таңдау маңызды."
