COM_JOOMLAUPDATE_POSTINSTALL_MSG_AUTOMATED_UPDATES_DESCRIPTION="<p>Joomla 5.4 нұсқасында қауіпсіздікті, өнімділікті арттыру және сайт компоненттерін өзекті күйде ұстау үшін The Update Framework (TUF) көмегімен Joomla-ны автоматты түрде жаңарту мүмкіндігі іске асырылды.</p><p>Автоматты жаңарту интернет желісінде ашық қолжетімді сайттар үшін қолжетімді. Сайт брандмауэрмен қорғалған немесе жалпыға қарауға қолжетімсіз болса (мысалы, жергілікті ортада пайдаланылса), жаңарту тек қолмен мүмкін.</p><p>Төмендегі параметрді қосқанда автоматты жаңарту сервері сайтты Joomla жобасы ұсынатын қызметте тіркейді. Тіркелу Joomla жобасына сервер мен сайт туралы ақпаратқа, атап айтқанда, PHP мен CMS нұсқасына, дерекқордың түрі мен нұсқасына және сервердің ОЖ-сіне қол жеткізуге мүмкіндік береді. Бұл ақпарат тек қызметті жақсарту үшін пайдаланылады.</p>"
