COM_JOOMLAUPDATE_ERRORMODAL_BODY_FORBIDDEN="<p><code>administrator/components/com_joomlaupdate/extract.php</code> файлын мына себептердің бірінен оқу мүмкін болмады:</p><ul><li><code>.htaccess</code> немесе <code>web.config</code> файлы (сервер түріне байланысты) файлға қатынауға тыйым салады,</li><li>Сервер параметрлері файлға қатынауға тыйым салады,</li><li>Сервердегі файлдың құқықтары мен атрибуттары файлға қатынауға рұқсат бермейді,</li><li>Сайт жүктемені теңестіргіштің немесе CDN-нің артында орналасқан, бірақ оның параметрлері файлға қатынауға рұқсат бермейді немесе пәрмендерді жіберуді блоктайды,</li><li>Файлға қатынау болса да, серверде пәрмендерді жіберу блокталған.</li></ul><p>Қатенің себебіне сенімді болмасаңыз, хостинг администрациясына хабарласыңыз.</p>"
COM_JOOMLAUPDATE_ERRORMODAL_BODY_INVALIDLOGIN="<p><code>administrator/components/com_joomlaupdate/extract.php</code> файлын мына себептердің бірінен оқу мүмкін болмады:</p><ul><li>Joomla-ны жаңарту нұсқаулары бар <code>administrator/components/com_joomlaupdate/update.php</code> файлын қолжетімділік құқықтарымен байланысты мәселелерге байланысты жасау мүмкін емес,</li><li><code>administrator/components/com_joomlaupdate/update.php</code> файлын <code>administrator/components/com_joomlaupdate/extract.php</code> файлының сценарийі қолжетімділік құқықтарымен байланысты мәселелерге байланысты оқи алмайды,</li><li>Браузер, желілік жабдық немесе сервер қауіпсіздік мақсатында <code>administrator/components/com_joomlaupdate/extract.php</code> файлына әр сұраумен жіберілетін парольді бүлдіреді.</li></ul><p>Қосымшалар орнатылмаған браузерді, ең дұрысы басқа провайдер арқылы желіге қосылған басқа компьютерде пайдаланып көріңіз. Қате қайталанса, хостинг администрациясына хабарласыңыз.</p>"
