PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_8_INTROTEXT="<p><strong>Біз Joomla 6-шы нұсқасын мақтанышпен ұсынамыз!</strong></p><p>Joomla-дағы үдерістер туралы көбірек біліңіз.</p>"
