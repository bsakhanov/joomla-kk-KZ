PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_9_FIELD_0="Lorem ipsum dolor sit amet, consectetur adipiscing elit."
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_9_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_9_INTROTEXT="<p>Үдерістер мақалаларыңыз жарияланғанға дейін өтуге тиіс кезеңдерді басқарады.</p><p>Үдерістерді басқаруға арналған компонент әдепкіде қосылмаған.</p><p>Үлгі деректермен бірге берілген үдерісті көру үшін алдымен осы функционалды қосу керек.</p><ol><li>Әкімшілік аймаққа кіріңіз</li><li>«Контент» > «Мақалалар» > «Параметрлер» > «Интеграция» қойындысында «Үдерісті қосу» параметрін «Иә» күйіне орнатыңыз</li><li>Өзгерістерді сақтаңыз</li></ol><p>Енді «Контент» бөліміне қайта кіргенде «Үдерістер» бөлімін көресіз.</p><p>Мақаланы өңдегенде үдерістерге қатысты мақалалардың жаңа ауысуларын да көресіз.</p>"
