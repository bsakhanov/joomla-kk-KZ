PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_INTROIMAGE_ALT="Таңғажайып Андромеда галактикасы"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_INTROTEXT="<p>Бұл — блогтағы жазбаның үлгісі.</p><p>Сайтқа кірсеңіз (әкімшілік бөлімге кіру сілтемесі осы беттің ең төменгі жағында), оны және барлық басқа бар мақалаларды өңдей аласыз. Сондай-ақ жаңа мақала жасап, сайтқа басқа да өзгерістер енгізе аласыз.</p><p>Мақалаларды қосып, өзгерткен сайын сайттың қалай өзгеретінін және оны әртүрлі жолмен қалай баптауға болатынын көресіз.</p><p>Тайынбаңыз, оны бұза алмайсыз.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_TITLE="Блогыңызға қош келдіңіз"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_FIELD_0="Lorem ipsum dolor sit amet, consectetur adipiscing elit."
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_FULLTEXT="<p>Толық бетте кіріспе контентті де, мақаланың қалған бөлігін де көресіз. Қаласаңыз, кіріспені жасыру үшін параметрлерді өзгертуге болады.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_INTROTEXT="<p>Басты бетіңіз блог категориясынан төрт соңғы мақаланы бір бағанда көрсетуге бапталған. Одан кейін келесі екі ескі мақалаға сілтемелер бар. Бұл сандарды сайт әкімшісіндегі блог қойындысындағы контент параметрлерін өңдеу арқылы өзгертуге болады. Жүйеге кірген болсаңыз, сайт әкімшісіне сілтеме бар.</p><p>Блог жазбасын екі бөлікке — кіріспеге және бөлек толық бетке — бөлгіңіз келсе, үзіліс енгізу үшін «Толығырақ» аймағын пайдаланыңыз.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_TITLE="Басты беттің туралы"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_FULLTEXTIMAGE_ALT="Шаян тұмандығы"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_INTROTEXT="<p>Сайтыңызда жиі пайдаланылатын кейбір модульдер алдын ала бапталған. Оларға мыналар кіреді:</p><ul><li>Сурет (түрі: Custom): ол меню астындағы суретті қамтиды. Бұл суретті өзгерту үшін өңдеуге болатын Custom модулі.</li><li>Танымал тегтер (түрі: Tags - Popular): мақалаларыңызда тегтеуді пайдалансаңыз, көрінеді. Өңдеу кезінде «Тегтер» өрісіне тег енгізіңіз.</li><li>Ескі жазбалар (түрі: Articles): мақалаларды категориялар бойынша тізімдейді.</li><li>Синдикация (түрі: Syndication Feeds): оқырмандарға жазбаларыңызды жаңалықтар оқу қолданбасында оқуға мүмкіндік береді.</li><li>Кіру формасы (түрі: Login): пайдаланушыларға сайттың шектеулі аймақтарына кіруге мүмкіндік береді.</li></ul><p>Бұл модульдердің әрқайсысында сайт әкімшісіндегі «Модульдер менеджерінде» тәжірибе жасауға болатын көптеген параметрлер бар. Жүйеге кіргенде жоғарғы оң жақ бұрыштағы өңдеу иконкасын таңдап, сол модульдің өңдеу экранына өтуге болады. Өңдеген кез келген модульді сақтап, жабуды ұмытпаңыз.</p><p>Joomla! сондай-ақ сайтыңызға қосуға болатын көптеген басқа модульдерді қамтиды. Сайтты дамытқан сайын <a href=\"https://extensions.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">Joomla кеңейтімдер каталогынан</a> табуға болатын қосымша модульдерді қосқыңыз келуі мүмкін.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_TITLE="Сайт модульдері"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_INTROTEXT="<p>Шаблондар сайттың сыртқы келбеті мен интерфейсін басқарады.</p><p>Бұл блог Cassiopeia шаблонымен орнатылған.</p><p>Параметрлерді жүйеге кірген кезде көрінетін менюдегі «Сайтыңызбен жұмыс істеу, Шаблон параметрлері» сілтемесін таңдау арқылы өңдеуге болады.</p><p>Мысалы, сайттың фон түсін, бөлектеу түсін, сайт атауын, сайт сипаттамасын және пайдаланылатын тақырып қарпін өзгертуге болады.</p><p>Көбірек параметрлер сайт әкімшісінде қолжетімді. Сондай-ақ кеңейтімдер менеджері арқылы жаңа шаблон орнатуға болады.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_TITLE="Сіздің шаблоныңыз"
