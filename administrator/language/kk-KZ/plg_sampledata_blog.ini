PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_0_INTROTEXT="<p>Бұл блог және оны жазатын адам туралы аздап айтып береді.</p><p>Жүйеге кірген кезде өңдеу иконкасын таңдау арқылы осы бетті өңдей аласыз.</p>"
