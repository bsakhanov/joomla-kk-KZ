PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_1_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_1_INTROTEXT="<p>Міне, сайтыңызбен жұмыс істеуге арналған бірнеше негізгі кеңес.</p><ul><li>Joomla!-ның қазір көріп отырған «фронтенді» және «әкімші» немесе «бэкенді» бар, мұнда сайтты құрудың күрделірек жұмысы, мысалы, менюлерді баптау және қандай модульдерді көрсету керектігін шешу орындалады. Әкімшілік бөлікке сайттың осы бөлігіне кіру үшін пайдаланған пайдаланушы атыңызбен және құпиясөзіңізбен бөлек кіру керек.</li><li>Сіз қалайтын алғашқы нәрселердің бірі — сайт атауы мен ұранын өзгерту және логотип қосу. Ол үшін жүйеге кірген кезде көрінетін менюдегі «Шаблон параметрлері» сілтемесін таңдаңыз. Сайттың сипаттамасын, браузер тақырыбын, әдепкі электрондық поштаны және басқа элементтерді өзгерту үшін «Сайт параметрлері» бөлімін таңдаңыз. Кеңейтілген конфигурация параметрлері әкімшілік бөлікте қолжетімді.</li><li>Сайттың сыртқы келбетін түбегейлі өзгерту үшін жаңа шаблон орнату қажет болуы мүмкін. «Жүйе» бөліміне өтіп, тізімнен «Орнату — Кеңейтімдер» таңдаңыз, кеңейтімдерді орнатушы ашылады. Joomla үшін көптеген тегін және коммерциялық шаблондар бар.</li><li>Өзіңіз көргендей, сайттың әртүрлі бөліктерін кімнің көре алатынын басқаруға болады. Модульдермен және мақалалармен жұмыс істегенде қолжетімділік деңгейін «Тіркелген» етіп орнатсаңыз, оларды тек жүйеге кірген пайдаланушылар көреді.</li><li>Жаңа мақала немесе басқа контент түрін жасағанда оны «Жарияланған» немесе «Жарияланбаған» ретінде сақтауға болады. Жарияланбаған болса, сайт келушілері оны көрмейді, бірақ сіз көресіз.</li><li>Joomla-мен жұмыс туралы көбірек білуді <a href=\"https://guide.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">Joomla құжаттама сайтынан</a> үйреніп, <a href=\"https://forum.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">Joomla форумдарында</a> басқа пайдаланушылардан көмек ала аласыз. Әкімшілік бөліктің әр бетінде сол беттің функциялары туралы толық ақпарат беретін анықтама түймелері бар.</li></ul>"
