COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Joomla 6.2-ге қош келдіңіз!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Ядродағы жаңартулар</h2><div class=\"col-12 mb-3\"><h3>Контентті өңдеудің жақсартулары</h3><ul><li><strong>Медиа менеджері мен «Толығырақ» түймесінің біріктірілуі</strong>: сурет пен медиа қосу жеңілдеді — жаңартылған таңдағыш енді Joomla медиа менеджерін ашады, ал жаңа «Толығырақ» түймесі мақаланы бөлетін белгіні тезірек енгізуге мүмкіндік береді.</li><li><strong>Сурет пен figure үшін бөлек кластар</strong>: мақаланың кіріспе/толық мәтініндегі суреттерде енді сурет пен оны қоршаған figure элементі үшін тәуелсіз CSS класс өрістері бар.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Ішкі деңгей меню\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Сайттың шаблоны (Cassiopeia)</h3><ul><li><strong>Көп деңгейлі ашылмалы меню</strong>: Cassiopeia менюі енді ашылмалы/жиналмалы үлгілерде бірден көп ішкі деңгейді қолдайды.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Модульдер және сайт конфигурациясы</h3><ul class=\"mb-3\"><li><strong>mod_login сілтемелерінің қосқыштары</strong>: жаңа параметрлер әкімшілерге шаблонды қайта анықтамай-ақ «Құпиясөзіңізді ұмыттыңыз ба?» және «Пайдаланушы атыңызды ұмыттыңыз ба?» сілтемелерін жасыруға мүмкіндік береді. Әдепкіде көрсетіледі, сондықтан бар сайттарға әсер етпейді.</li><li><strong>Кеңейтімдер жаңартуларының қауіпсіздік белгісі</strong>: әзірлеушілер шығарылымды қауіпсіздік жаңартуы ретінде белгілей алады (маңыздылығы «Жоқ» деңгейінен «Сыни» деңгейіне дейін); белгіленген жаңартулар Жүйе &#8594; Жаңарту &#8594; Кеңейтімдер бөлімінде және бақылау тақтасының жылдам белгішесінде бөлектеледі.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Кеңейтімдердегі қауіпсіздік белгілері\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Joomla 6.2-дегі жаңалықтар!"
