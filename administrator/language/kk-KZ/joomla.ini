JGLOBAL_FILTER_TYPE_DESC="<p><strong>Қара тізім</strong> сүзгі өрістеріне қосылғандарынан басқа кез келген тегтер мен атрибуттарды пайдалануға мүмкіндік береді.</p><p>Әдепкі бойынша қара тізімде мына тегтер бар: applet, body, bgsound, base, basefont, canvas, embed, frame, frameset, head, html, id, iframe, ilayer, layer, link, meta, name, object, script, style, title, xml.</p><p>Әдепкі бойынша қара тізімде мына атрибуттар бар: action, background, codebase, dynsrc, lowsrc, formaction.</p><p><strong>Қара тізім (пайдаланушылық)</strong> әдепкі қара тізімді қайта анықтап, сүзгі өрістеріне қосылған кез келген тегтер мен атрибуттарға тыйым салуға мүмкіндік береді.</p><p><strong>Ақ тізім</strong> сүзгі өрістеріне қосылған кез келген тегтер мен атрибуттарды пайдалануға мүмкіндік береді.</p><strong>HTML-ге тыйым</strong> мақаланы сақтау сәтінде барлық HTML тегтерін жоюға мүмкіндік береді.</p><p>Мәтін сүзгілері көрнекі редактордан тәуелсіз жұмыс істейтінін ескеріңіз. Редактор параметрлерінде сүзу өшірулі болса да, мәтіннің өз сүзгілері мақаланы сақтамас бұрын кодты түзетеді.</p>"
