COM_GUIDEDTOURS_TOUR_USERS_STEP_NEW_TITLE="Пайдаланушы жасау"
COM_GUIDEDTOURS_TOUR_USERS_STEP_NEW_DESCRIPTION="Жаңа пайдаланушы жасау үшін «Жасау» түймесін басыңыз."

COM_GUIDEDTOURS_TOUR_USERS_STEP_NAME_TITLE="Аты"
COM_GUIDEDTOURS_TOUR_USERS_STEP_NAME_DESCRIPTION="Пайдаланушыға міндетті атауды енгізіңіз."

COM_GUIDEDTOURS_TOUR_USERS_STEP_LOGINNAME_TITLE="Кіру атын қосыңыз"
COM_GUIDEDTOURS_TOUR_USERS_STEP_LOGINNAME_DESCRIPTION="Пайдаланушыға арналған міндетті кіру атын (пайдаланушы атын) енгізіңіз."

COM_GUIDEDTOURS_TOUR_USERS_STEP_PASSWORD_TITLE="Құпиясөзді енгізіңіз"
COM_GUIDEDTOURS_TOUR_USERS_STEP_PASSWORD_DESCRIPTION="(Жаңа) құпиясөзді толтырыңыз. Бұл өріс міндетті болмаса да, құпиясөз орнатылмаса, пайдаланушы жүйеге кіре алмайды."

COM_GUIDEDTOURS_TOUR_USERS_STEP_PASSWORD2_TITLE="Парольді растаңыз"
COM_GUIDEDTOURS_TOUR_USERS_STEP_PASSWORD2_DESCRIPTION="Растау үшін жоғарыдағы өрістегі құпиясөзді қайта енгізіңіз. Жаңа құпиясөз өрісі толтырылса, бұл өріс міндетті."

COM_GUIDEDTOURS_TOUR_USERS_STEP_EMAIL_TITLE="Электрондық пошта"
COM_GUIDEDTOURS_TOUR_USERS_STEP_EMAIL_DESCRIPTION="Пайдаланушының электрондық пошта мекенжайын енгізіңіз."

COM_GUIDEDTOURS_TOUR_USERS_STEP_SYSTEMEMAIL_TITLE="Жүйелік хаттарды алу"
COM_GUIDEDTOURS_TOUR_USERS_STEP_SYSTEMEMAIL_DESCRIPTION="Пайдаланушы жүйелік хаттарды алуы керек болса, «Иә» деп орнатыңыз."

COM_GUIDEDTOURS_TOUR_USERS_STEP_STATUS_TITLE="Күйі"
COM_GUIDEDTOURS_TOUR_USERS_STEP_STATUS_DESCRIPTION="Бұл пайдаланушыны қосыңыз немесе бұғаттаңыз."

COM_GUIDEDTOURS_TOUR_USERS_STEP_PASSWORDRESET_TITLE="Парольді қалпына келтіруді талап ету"
COM_GUIDEDTOURS_TOUR_USERS_STEP_PASSWORDRESET_DESCRIPTION="«Иә» деп орнатылса, пайдаланушы сайтқа келесі кіргенде құпиясөзін қалпына келтіруге тиіс болады."

COM_GUIDEDTOURS_TOUR_USERS_STEP_SAVECLOSE_TITLE="«Сақтау және жабу» түймесін басыңыз"
COM_GUIDEDTOURS_TOUR_USERS_STEP_SAVECLOSE_DESCRIPTION="Пайдаланушыны сақтап, жабыңыз."

COM_GUIDEDTOURS_TOUR_USERS_STEP_CONGRATULATIONS_TITLE="Құттықтаймыз!"
COM_GUIDEDTOURS_TOUR_USERS_STEP_CONGRATULATIONS_DESCRIPTION="Сіз пайдаланушы жасадыңыз."
