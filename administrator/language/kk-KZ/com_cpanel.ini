COM_CPANEL_MSG_ADDNOSNIFF_BODY="<p>Joomla 3.9 нұсқасында <strong>htaccess.txt</strong> және <strong>web.config.txt</strong> файлдарына әдепкі бойынша браузерлердегі MIME түрін \"тыңдау\" деп аталатын функцияны өшіруге мүмкіндік беретін қауіпсіздік ережесі қосылды. Деректерді ұстап алу әдетте қауіпсіз файл пішімдерінде сценарийлері орындалатын белгілі бір шабуыл векторларына әкелуі мүмкін.</p><p>Файлдарды автоматты түрде жаңарту мүмкін болмағандықтан, Joomla қауіпсіздік командасы <strong>.htaccess</strong> немесе <strong>web.config</strong> файлдарына өзгерістерді қолмен енгізуді ұсынады.</p><p><strong>.htaccess</strong> файлында <strong>## Mod_rewrite</strong> алдына қосыңыз:</p><pre>&lt;IfModule mod_headers.c&gt;\nHeader always set X-Content-Type-Options \"nosniff\"\n&lt;/IfModule&gt;</pre><p><strong>web.config</strong> файлында <strong>&lt;/rewrite&gt;</strong> кейін қосыңыз:</p><pre>&lt;httpProtocol&gt;\n  &lt;customHeaders&gt;\n    &lt;add name=\"X-Content-Type-Options\" value=\"nosniff\" /&gt;\n  &lt;/customHeaders&gt;\n&lt;/httpProtocol&gt;</pre>" ; Translators: Don't touch the code part in the message, Starting with ## Mod_rewrite &hellip;
COM_CPANEL_MSG_ADDNOSNIFF_TITLE=".htaccess және web.config файлдарын жаңарту"
COM_CPANEL_MSG_HTACCESSSVG_BODY="<p>Joomla 3.9 нұсқасында <strong>htaccess.txt</strong> файлына әдепкі бойынша SVG файлдарын пайдаланғанда сайтты <a href=\"https://en.wikipedia.org/wiki/Cross-site_scripting\" target=\"_blank\" rel=\"noopener noreferrer\">Cross-site scripting (XSS)</a> түріндегі шабуылдардан қорғауға мүмкіндік беретін қауіпсіздік ережесі қосылды.</p><p>Файлды автоматты түрде жаңарту мүмкін болмағандықтан, Joomla қауіпсіздік командасы <strong>.htaccess</strong> файлына өзгерістерді қолмен енгізуді ұсынады.</p><p>Мына кодты табыңыз:</p><pre>## Can be commented out if causes errors, see notes above.\nOptions +FollowSymlinks\nOptions -Indexes</pre><p>Одан кейін қосыңыз:</p><pre>## Disable inline JavaScript when directly opening SVG files or embedding them with the object-tag\n&lt;FilesMatch \"\.svg$\"&gt;\n  &lt;IfModule mod_headers.c&gt;\n    Header always set Content-Security-Policy \"script-src 'none'\"\n  &lt;/IfModule&gt;\n&lt;/FilesMatch&gt;</pre><p>Қазіргі уақытта IIS серверлері үшін осындай баптау тәсілі бізге белгісіз. Қосымша ақпарат алу үшін хостинг администрациясына хабарласыңыз.</p>"
COM_CPANEL_MSG_HTACCESSSVG_TITLE="SVG файлдарын пайдаланғанда XSS-тен қорғау"
COM_CPANEL_MSG_LANGUAGEACCESS340_BODY="<p>Joomla 3.4 нұсқасында көптілділік жүйесінің параметрлеріне өзгерістер енгізілді, сондықтан сайтта <a href=\"index.php?option=com_plugins&view=plugins&filter[folder]=system&filter[element]=languagefilter\">Жүйе - Тіл сүзгісі</a> плагинімен мәселелер туындауы мүмкін. Мәселелерді түзету үшін <a href=\"index.php?option=com_languages&view=languages\">Контент тілдері</a> бетіне өтіп, әр контент тілін және қажетті қолжетімділік деңгейін қолмен сақтаңыз.</p>"
COM_CPANEL_MSG_LANGUAGEACCESS340_TITLE="Көптілділік жүйесінің параметрлерімен мәселелер"
COM_CPANEL_MSG_ROBOTS_BODY="<p>Joomla 3.3 нұсқасында <strong>robots.txt</strong> файлына SEO көрсеткіштерін жақсарту мақсатында іздеу жүйелеріне шаблондар мен медиа файлдарын индекстеуге рұқсат беретін ереже қосылды. Файлды автоматты түрде жаңарту мүмкін болмағандықтан, Joomla қауіпсіздік командасы әдепкі <strong>robots.txt.dist</strong> файлындағы өзгерістермен танысып, оларды <strong>robots.txt</strong> файлына қолмен енгізуді ұсынады.</p>"
COM_CPANEL_MSG_ROBOTS_TITLE="robots.txt файлын жаңарту"
COM_CPANEL_MSG_STATS_COLLECTION_BODY="<p>Joomla 3.5 нұсқасында Joomla орнатылатын пайдаланушылық орталарды зерттеуге және олардың үйлесімділігін арттыруға көмектесу үшін сервер мен сайт туралы деректерді жинауға және жіберуге арналған плагин қосылды. Деректерге PHP нұсқасы, CMS нұсқасы, дерекқордың түрі мен нұсқасы және сервердің ОЖ кіреді. Мұндай міндеттің қажеттілігі Joomla 3.3 нұсқасына BCrypt функциясы арқылы қауіпсізірек парольдерді іске асыру үшін PHP 5.3.10 нұсқасы қажет болған кезде айқын болды.</p><p>Толық ашықтықты қамтамасыз ету және әзірлеушілерге көмек ретінде деректер <a href=\"https://developer.joomla.org/about/stats.html\" target=\"_blank\" rel=\"noopener noreferrer\">Пайдалану статистикасы</a> бетінде қолжетімді. Графиктерде пайдаланушылар қолданатын Joomla нұсқалары, PHP нұсқалары және дерекқор түрлері көрсетілген.</p><p>Joomla жобасына сервер мен сайт туралы деректерді бергіңіз келмесе, <a href=\"index.php?option=com_plugins&view=plugins&filter[folder]=system&filter[element]=stats\" target=\"_blank\">Жүйе - Joomla статистикасы</a> плагинін өшіріңіз немесе оның параметрлерін өзгертіңіз.</p>"
COM_CPANEL_MSG_STATS_COLLECTION_TITLE="Сервер мен сайт туралы деректерді жинау және жіберу"
COM_CPANEL_MSG_TEXTFILTER3919_BODY="<p>Joomla 3.9 нұсқасында Joomla мәтін сүзгілерінің әдепкі параметрлеріне өзгерістер енгізілді. Енді <strong>Public</strong>, <strong>Guest</strong> және <strong>Registered</strong> пайдаланушылар топтары үшін әдепкі мән — <strong>HTML-ге тыйым</strong>.</p><p>Өзгерістер тек Joomla-ның жаңа орнатылымына қолданылатындықтан, Joomla қауіпсіздік командасы Жүйе &#8594; Жалпы баптаулар &#8594; Мәтін сүзгілері бетінде мәтін сүзгілерін жаңартуды ұсынады.</p>"
COM_CPANEL_MSG_TEXTFILTER3919_TITLE="Мәтін сүзгілерін жаңарту"
