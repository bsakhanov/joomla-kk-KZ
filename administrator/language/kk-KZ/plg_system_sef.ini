PLG_SEF_INDEXPHP_DESCRIPTION="Жалпы конфигурацияда «URL қайта жазуды пайдалану» қосылғанда URL-дардағы 'index.php' өңдеуді қатаңдатады. Егер URL-да 'index.php' әлі де бар болса, оны алып тастайды және 'index.php' бар кіріс сұрауларын 'index.php' жоқ нұсқаға қайта бағыттайды."
