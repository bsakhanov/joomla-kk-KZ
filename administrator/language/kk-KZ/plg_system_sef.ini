PLG_SEF_DOMAIN_DESCRIPTION="Сайтыңызға бірнеше домен арқылы кіруге болатын болса, мұнда қалаулы (кейде канондық деп аталатын) доменді енгізіңіз. <br><strong>Ескертпе:</strong> https://example.com және https://www.example.com — әртүрлі домендер."
