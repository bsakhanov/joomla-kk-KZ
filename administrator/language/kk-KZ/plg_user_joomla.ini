PLG_USER_JOOMLA_NEW_USER_EMAIL_BODY="Сәлеметсіз бе, {NAME},\n\n\nӘкімші сізді {SITENAME} сайтына пайдаланушы ретінде қосты.\n\nБұл хатта {URL} мекенжайына кіруге арналған пайдаланушы атыңыз бен құпиясөзіңіз бар.\n\nПайдаланушы аты: {USERNAME}\nҚұпиясөз: {PASSWORD}\n\n\nБұл хабарламаға жауап бермеңіз, өйткені ол автоматты түрде жасалған және тек ақпараттық мақсатта жіберілген."
