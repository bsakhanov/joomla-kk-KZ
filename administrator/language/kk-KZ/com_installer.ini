COM_INSTALLER_MSG_WARNINGS_JOOMLATMPNOTWRITEABLEDESC="Уақытша файлдар каталогы кеңейту файлдары бар пакеттерді ашуға арналған. Ашқаннан кейін файлдар сайттың белгілі бір каталогтарына жылжытылады. configuration.php файлындағы <strong>$tmp_path</strong> айнымалысы үшін уақытша файлдар каталогына жол анықталғанын тексеріңіз, сондай-ақ %s каталогына жазу құқықтарын орнатыңыз."
COM_INSTALLER_MSG_WARNINGS_LOWMEMORYDESC="Жад жеткіліксіз (PHP Memory Limit)"
COM_INSTALLER_MSG_WARNINGS_LOWMEMORYWARN="Үлкен кеңейтулерді орнатқанда мәселелер туындауы мүмкін. Қазір жадты пайдалануға 16 Мбайттан аз шектеу орнатылған. php.ini файлындағы <strong>memory_limit</strong> айнымалысының мәнін 32M-ге өзгертіңіз."
COM_INSTALLER_MSG_WARNINGS_MEDMEMORYDESC="Жад жеткіліксіз болуы мүмкін (PHP Memory Limit)"
COM_INSTALLER_MSG_WARNINGS_MEDMEMORYWARN="Үлкен кеңейтулерді орнатқанда мәселелер туындауы мүмкін. Қазір жадты пайдалануға 24 Мбайттан аз шектеу орнатылған. php.ini файлындағы <strong>memory_limit</strong> айнымалысының мәнін 32M-ге өзгертіңіз."
