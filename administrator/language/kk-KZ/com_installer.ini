COM_INSTALLER_MSG_WARNINGS_PHPUPLOADNOTWRITEABLEDESC="<strong>upload_tmp_dir</strong> директивасымен анықталатын PHP уақытша файлдар каталогы жүктелген файлдарды PHP интерпретаторы алған, бірақ Joomla-ға әлі бермеген сәтте сақтауға арналған. %s каталогына жазу құқықтарын орнатыңыз."
COM_INSTALLER_MSG_WARNINGS_SMALLPOSTSIZE="POST сұрауының ең үлкен өлшемі шектелген"
COM_INSTALLER_MSG_WARNINGS_SMALLPOSTSIZEDESC="POST сұрауының ең үлкен өлшемі серверге беруге болатын ақпараттың жалпы көлемін анықтайды. Қазір 16 Мбайттан аз мән орнатылған, бұл үлкен мақалаларды сақтағанда немесе кеңейтулерді жүктегенде мәселелер тудыруы мүмкін. php.ini файлындағы <strong>post_max_size</strong> айнымалысының мәнін өзгертіңіз."
COM_INSTALLER_MSG_WARNINGS_SMALLUPLOADSIZE="Жүктелетін файлдың ең үлкен өлшемі шектелген"
COM_INSTALLER_MSG_WARNINGS_SMALLUPLOADSIZEDESC="Жүктелетін файлдың ең үлкен өлшемі 16 Мбайттан аз. Үлкен кеңейтулерді орнатқанда мәселелер туындауы мүмкін. php.ini және/немесе .htaccess файлындағы айнымалылардың мәндерін <strong>post_max_size</strong> мәні <strong>upload_max_filesize</strong> мәнінен үлкен немесе тең болатындай етіп өзгертіңіз."
COM_INSTALLER_MSG_WARNINGS_UPDATE_NOTICE="Жаңартпас бұрын кеңейтулердің пайдаланылатын Joomla нұсқасымен үйлесімділігін тексеріңіз. Дерекқор мен сайт файлдарының резервтік көшірмесін жасау қатаң ұсынылады."
