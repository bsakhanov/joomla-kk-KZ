COM_INSTALLER_MSG_WARNINGS_PHPUPLOADNOTSET="PHP конфигурациясында уақытша файлдар каталогы анықталмаған"
COM_INSTALLER_MSG_WARNINGS_PHPUPLOADNOTSETDESC="<strong>upload_tmp_dir</strong> директивасымен анықталатын PHP уақытша файлдар каталогы жүктелген файлдарды PHP интерпретаторы алған, бірақ Joomla-ға әлі бермеген сәтте сақтауға арналған. Манифест файлын немесе басқа жүктелетін файлдарды табуда мәселелер туындаса, php.ini файлында уақытша файлдар каталогына жолды анықтаңыз."
