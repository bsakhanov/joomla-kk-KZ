PLG_QUICKICON_PHPVERSIONCHECK="Жылдам иконка — PHP нұсқасын тексеру"
PLG_QUICKICON_PHPVERSIONCHECK_SECURITY_ONLY="PHP нұсқаңызға (%1$s) PHP жобасы қазір тек қауіпсіздік түзетулерін ғана шығарады. Бұл PHP нұсқаңызға жақында қолдау көрсетілмейтінін білдіреді. %2$s күні қолдау аяқталмай тұрып, PHP-дің жаңарақ нұсқасына көшуді жоспарлауды ұсынамыз. PHP-дің жаңарақ нұсқасына көшкенде Joomla жылдамырақ әрі қауіпсіздеу жұмыс істейді. Жаңарту нұсқаулығын алу үшін хостинг провайдеріңізге хабарласыңыз." ; Key 1 is the server's current PHP version, key 2 is the date at which support will end for the current PHP version
PLG_QUICKICON_PHPVERSIONCHECK_UNSUPPORTED="Серверіңіз PHP %1$s нұсқасын пайдаланып жатқанын анықтадық; ол ескірген және әзірлеушілерінен ресми қауіпсіздік жаңартуларын алмайды. Joomla! жобасы сайтыңызды PHP %2$s немесе одан жаңа нұсқасына жаңартуды ұсынады, ол қауіпсіздік жаңартуларын кемінде %3$s дейін алады. <br><br>Хостинг провайдеріңізден сайтыңыз үшін PHP %2$s немесе одан жаңа нұсқасын әдепкі нұсқа етуді сұраңыз. Хостинг провайдеріңіз PHP %2$s нұсқасына дайын болса, сайттың түбірлік және 'administrator' каталогтарында PHP %2$s нұсқасын қосыңыз — әдетте мұны хостинг басқару панеліндегі құралмен өзіңіз жасай аласыз, бірақ сенімсіз болсаңыз, хостинг провайдеріңізден сұраған дұрыс." ; Key 1 is the server's current PHP version, key 2 is the recommended PHP version, and key 3 is the date at which support will end for the recommended PHP version
PLG_QUICKICON_PHPVERSIONCHECK_UNSUPPORTED_JOOMLA_OUTDATED="Серверіңіз PHP %1$s нұсқасын пайдаланып жатқанын анықтадық; ол ескірген және әзірлеушілерінен ресми қауіпсіздік жаңартуларын алмайды. Сонымен қатар Joomla! нұсқаңыз ескірген болғандықтан, PHP-дің жаңарақ нұсқасын ұсына алмаймыз. Алдымен Joomla!-ны жаңартып, содан кейін PHP-ді жаңарту бойынша қосымша нұсқауларды орындауды ұсынамыз." ; Key 1 is the server's current PHP version
PLG_QUICKICON_PHPVERSIONCHECK_XML_DESCRIPTION="Орнатылымыңыздағы PHP нұсқасының қолдау күйін тексереді және толық қолдау көрсетілмесе, ескерту шығарады."
