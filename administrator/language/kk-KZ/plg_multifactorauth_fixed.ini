PLG_MULTIFACTORAUTH_FIXED_LBL_PLACEHOLDER="Тұрақты кодыңызды енгізіңіз"
PLG_MULTIFACTORAUTH_FIXED_LBL_POSTMESSAGE="<p class=\"alert alert-info\">Код аймағының үстінде және астында көрсетілетін хабарламаларды <code>PLG_MULTIFACTORAUTH_FIXED_LBL_PREMESSAGE</code> және <code>PLG_MULTIFACTORAUTH_FIXED_LBL_POSTMESSAGE</code> тіл жолдарын қайта анықтау арқылы өзгертуге болады.</p>"
PLG_MULTIFACTORAUTH_FIXED_LBL_PREMESSAGE="<p>Бұл — Joomla-ға арналған көпфакторлы аутентификацияның демонстрациялық плагині. Осы пайдаланушы үшін көпфакторлы аутентификацияны қосқанда бапталған тұрақты кодты енгізу керек. Ол іс жүзінде екінші құпиясөз ретінде жұмыс істейді.</p>"
PLG_MULTIFACTORAUTH_FIXED_LBL_SETUP_POSTMESSAGE="<p class=\"alert alert-info\">Баптау аймағының үстінде және астында көрсетілетін хабарламаларды <code>PLG_MULTIFACTORAUTH_FIXED_LBL_SETUP_PREMESSAGE</code> және <code>PLG_MULTIFACTORAUTH_FIXED_LBL_SETUP_POSTMESSAGE</code> тіл жолдарын қайта анықтау арқылы өзгертуге болады</p>"
PLG_MULTIFACTORAUTH_FIXED_LBL_SETUP_PREMESSAGE="<p>Төменге тұрақты кодты енгізіңіз. Жүйеге кіргеннен кейін сайтты пайдаланбас бұрын осы тұрақты кодты енгізу талап етіледі.</p>"
PLG_MULTIFACTORAUTH_FIXED_LBL_SHORTINFO="Өз алдын ала белгіленген кодыңызды таңдаңыз. <strong>Тек демонстрациялық мақсаттарға арналған</strong>."
PLG_MULTIFACTORAUTH_FIXED_XML_DESCRIPTION="Тұрақты кодты («екінші құпиясөз») пайдаланатын көпфакторлы аутентификацияның демонстрациялық плагині. <strong>Жұмыс істеп тұрған сайттарда пайдаланбаңыз, ол қауіпсіз емес.</strong> Бұл плагин тек өз плагиндерін жасауға қызығатын әзірлеушілерге үлгі ретінде арналған."
