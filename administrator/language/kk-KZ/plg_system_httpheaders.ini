PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY="<a href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP\" target=\"_blank\" rel=\"noopener noreferrer\">Content Security Policy (CSP)</a>" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_CLIENT="Жүйе аймағы"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_FRAME_ANCESTORS_SELF_ENABLED="frame-ancestors 'self'" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_FRAME_ANCESTORS_SELF_ENABLED_DESC="Фреймдерді бұғаттап қорғаудың (clickjacking) CSP frame-ancestors функциясын қосады және тек 'self' түпнегізіне рұқсат береді. 'self'-тен басқа түпнегіздерге рұқсат беру үшін төмендегі форманы пайдаланыңыз."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_NONCE_ENABLED="<a href=\"https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/nonce\" target=\"_blank\" rel=\"noopener noreferrer\">Nonce</a>" ; Please only change the URL
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_NONCE_ENABLED_DESC="Joomla API арқылы жасалатын барлық скрипттер мен стильдер үшін криптографиялық nonce (бір рет қолданылатын сан) көмегімен нақты инлайн скрипттердің ақ тізімін қосады. Nonce көрсету заманауи браузерді 'unsafe-inline' мәнін елемеуге мәжбүр етеді; ол nonce қолдамайтын ескі браузерлер үшін орнатылып қала беруі керек."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_REPORT_ONLY_DESC="'Content-Security-Policy' орнына 'Content-Security-Policy-Report-Only' тақырыбын пайдалану." ; Do not translate 'Content-Security-Policy' & 'Content-Security-Policy-Report-Only'
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_REPORT_ONLY="Report-Only" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STRICT_DYNAMIC_ENABLED="strict-dynamic" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STRICT_DYNAMIC_ENABLED_DESC="strict-dynamic бастапқы өрнегі разметкадағы скриптке nonce немесе хэш қосу арқылы берілген сенімнің сол түбірлік скрипт жүктейтін барлық скрипттерге таратылуы керектігін анықтайды. Сонымен бірге 'self' немесе 'unsafe-inline' сияқты кез келген рұқсат етілген немесе бастапқы өрнектер елемеледі." ; Do not translate 'strict-dynamic', 'self' and 'unsafe-inline'
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_SCRIPT_HASHES_ENABLED="<a href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/script-src\" target=\"_blank\" rel=\"noopener noreferrer\">Script hashes</a>" ; Please only change the URL
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_SCRIPT_HASHES_ENABLED_DESC="Joomla API арқылы жасалатын барлық скрипттер үшін криптографиялық хэш көмегімен инлайн скрипттердің қосымша хэшке негізделген ақ тізімін қосады. Хэштерді көрсету заманауи браузерді 'unsafe-inline' мәнін елемеуге мәжбүр етеді; ол хэш қолдамайтын ескі браузерлер үшін орнатылып қала беруі керек."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STYLE_HASHES_ENABLED="<a href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/style-src\" target=\"_blank\" rel=\"noopener noreferrer\">Style hashes</a>" ; Please only change the URL
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STYLE_HASHES_ENABLED_DESC="Joomla API арқылы жасалатын барлық стильдер үшін криптографиялық хэш көмегімен инлайн стильдердің қосымша хэшке негізделген ақ тізімін қосады. Хэштерді көрсету заманауи браузерді 'unsafe-inline' мәнін елемеуге мәжбүр етеді; ол хэш қолдамайтын ескі браузерлер үшін орнатылып қала беруі керек."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES="Директива қосу"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES_DIRECTIVE="Саясат директивасы"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES_VALUE="Мәні"
