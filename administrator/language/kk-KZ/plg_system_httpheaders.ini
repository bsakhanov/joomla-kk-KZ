PLG_SYSTEM_HTTPHEADERS_HEADER_CLIENT_BOTH="Бүкіл сайт"
PLG_SYSTEM_HTTPHEADERS_HSTS="<a href=\"https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security\" target=\"_blank\" rel=\"noopener noreferrer\">HTTP Strict Transport Security (HSTS)</a>" ; Please only change the URL
PLG_SYSTEM_HTTPHEADERS_HSTS_MAXAGE="max-age" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_HSTS_MAXAGE_DESC="Бұл параметр 'max-age' уақытын орнатады, ол секундпен көрсетіледі. Әдепкі мәні — 31536000, ол бір жылға сәйкес келеді" ; Please do not translate 'max-age'
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD="<a href=\"https://hstspreload.org\" target=\"_blank\" rel=\"noopener noreferrer\">Preload</a>" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_DESC="Бұл параметр браузердің preload тізімдері деп аталатындарына қосылуға келісімді белсендіреді."
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_NOTE="Маңызды"
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_NOTE_DESC="HSTS доменіңізге енді HTTPS-сіз кіруге болмайтынын білдіреді. Preload тізіміне қосылғаннан кейін мұны кері қайтару оңай емес. Домендерді алып тастауға болады, бірақ пайдаланушылар үшін браузер жаңартуы арқылы өзгеріс күшіне енуіне бірнеше ай кетеді.<br><strong>Бұл параметр 'man-in-the-middle' шабуылдарының алдын алу үшін өте маңызды, сондықтан оны кез келген жағдайда қосу керек, бірақ тек HTTPS домен мен барлық ішкі домендер үшін ұзақ мерзімді перспективада қолдау табатынына сенімді болсаңыз ғана! Тізімге қосу үшін 'max-age' мәні 63072000 (2 жыл) болып орнатылуы керек.</strong>" ; Please do not translate 'max-age'
PLG_SYSTEM_HTTPHEADERS_HSTS_SUBDOMAINS="Ішкі домендер үшін де"
PLG_SYSTEM_HTTPHEADERS_HSTS_SUBDOMAINS_DESC="HSTS <strong>ішкі домендер үшін</strong> да қосылуы керек: SSL сертификатын жасағанда әдетте «www» ішкі домені ескеріледі. Басқа ішкі домендер пайдаланылса, оларға да жарамды SSL сертификаты берілгеніне назар аударыңыз."
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_ACTION="Әдепкі қауіпсіздік тақырыптарын қосу"
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_BODY="<p>Joomla! http қауіпсіздік тақырыптарын өңдеуге көмектесетін кірістірілген құралдар жиынымен келеді. Бұл тақырыптар браузерге, мысалы, сайтты <a href='https://en.wikipedia.org/wiki/Cross-site_scripting' target='_blank' rel='noopener noreferrer'>XSS</a> және <a href='https://en.wikipedia.org/wiki/Clickjacking' target='_blank' rel='noopener noreferrer'>Clickjacking</a> шабуылдарынан қорғауға көмектеседі.</p><p>Толығырақ ақпаратты Joomla! құжаттамасындағы <a href='https://guide.joomla.org/user-manual/security/security-http-headers' target='_blank' rel='noopener noreferrer'>HTTP тақырыптарын басқару бойынша оқулықтан</a> табуға болады.</p>"
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_TITLE="HTTP Security Headers"
