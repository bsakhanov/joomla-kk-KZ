PLG_MULTIFACTORAUTH_WEBAUTHN="Көпфакторлы аутентификация — Passkey"
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_INVALID_LOGIN_REQUEST="Аутентификация сұрауы жарамсыз."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_INVALID_PK="Passkey тіркеу сәтсіз аяқталды. Браузерден алынған passkey жауабы сервер берген ашық кілтке сәйкес келмейді. Бұл біреу сізді бұзуға тырысқанын немесе бірдеңенің бұзылғанын білдіреді."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_INVALID_USER="Қауіпсіздік себептері бойынша басқа пайдаланушының атынан passkey тіркеуге болмайды."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_NO_ATTESTED_DATA="Бірдеңе дұрыс болмады, бірақ қате туралы қосымша ақпарат қазір жоқ. Passkey тіркеуді қайталап көріңіз."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_NO_PK="Сервер passkey тіркеу үшін ашық кілт бермеді, бірақ браузерден passkey тіркеу сұрауын қандай да бір жолмен алды. Бұл біреу сізді бұзуға тырысқанын немесе бірдеңенің бұзылғанын білдіреді."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NOTAVAILABLE_BODY="Браузеріңіз passkey стандартын қолдамайды. Барлық браузерлер барлық құрылғыларда passkey-мен әлі үйлесімді емес."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NOTAVAILABLE_HEAD="Браузеріңізде passkey қолдауы жоқ"
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NOTHTTPS_BODY="Passkey арқылы көпфакторлы аутентификацияны қосу үшін сайтқа HTTPS арқылы кіріңіз."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NOTHTTPS_HEAD="Passkey тек HTTPS арқылы қолжетімді"
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NO_STORED_CREDENTIAL="Сіз passkey-ді әлі баптамағансыз немесе пайдаланғыңыз келген passkey жарамсыз."
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_CONFIGURED="Passkey-ді әлдеқашан бапталғансыз. Бұл беттен тек оның атауын өзгертуге болатынын ескеріңіз."
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_DISPLAYEDAS="Passkeys"
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_INSTRUCTIONS="Web Authentication үдерісін бастау үшін осы беттегі «%s» түймесін пайдаланыңыз. Содан кейін таңдаған passkey арқылы Web Authentication-ды аяқтау үшін браузер беретін нұсқауларды орындаңыз."
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_REGISTERKEY="Қосу"
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_SHORTINFO="Кез келген аппараттық немесе бағдарламалық қауіпсіздік кілтімен браузер passkey-лерін пайдаланыңыз."
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_VALIDATEKEY="Растау"
PLG_MULTIFACTORAUTH_WEBAUTHN_XML_DESCRIPTION="Браузер passkey-лерін көпфакторлы аутентификация әдісі ретінде пайдаланыңыз. Оны барлық заманауи браузерлер қолдайды. Көптеген браузерлер құпиясөзбен және/немесе биометриямен (саусақ ізі сканері, бет сканері, &hellip;) қорғалған құрылғыға тән аутентификацияны ұсынады."
