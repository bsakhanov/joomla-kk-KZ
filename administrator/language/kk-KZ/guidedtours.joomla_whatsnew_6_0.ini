COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_DESCRIPTION="<h1 class=\"fw-medium\">Joomla 6-ға қош келдіңіз!</h1><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-6 text-center text-md-start mb-3\"><img class=\"img-fluid shadow\" src=\"media/com_guidedtours/images/6_0/cassiopeiacolors.jpg\" alt=\"Туынды шаблон стилін баптау құралын көрсету\" width=\"640\" height=\"380\"></div><div class=\"col-md-6 col-lg-6 mb-3\"><h2 class=\"mb-3\">Cassiopeia Extended</h2><p>Қаріп пен түстерді өзгерту сияқты кеңейтілген баптау мүмкіндіктерін көрсететін жаңа стилі бар туынды шаблондарды зерттеңіз.</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-12 mb-3\"><h2 class=\"mb-3\">Нұсқаларды кеңейтілген басқару</h2><p>Joomla-ның нұсқалау жүйесі арнайы өрістерді, тегтер мен категорияларды қамтитындай жетілдірілді, бұл контенттегі барлық өзгерістерді қадағалауға, салыстыруға және қалпына келтіруге мүмкіндік береді.</p></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_TITLE="Joomla 6-дағы жаңалықтар!"
