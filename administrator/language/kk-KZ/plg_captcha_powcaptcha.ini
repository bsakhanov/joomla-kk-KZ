PLG_CAPTCHA_POWCAPTCHA="CAPTCHA - Proof of Work"
PLG_CAPTCHA_POWCAPTCHA_XML_DESCRIPTION="Бұл CAPTCHA плагині пайдаланушы браузеріне браузер автоматты түрде шеше алатын математикалық тапсырма ұсынады. Ол пайдаланушының адам екенін дәлелдеуге емес, тапсырманы шешуге қажетті уақытты жұмсауға дайын екенін дәлелдеуге арналған. Қазіргі уақытта Altcha (altcha.org) кітапханасына негізделген."

