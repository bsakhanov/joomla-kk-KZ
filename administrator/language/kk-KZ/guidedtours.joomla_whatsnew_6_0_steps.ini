COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_0_DESCRIPTION="<div class=\"row align-items-center pt-3\"><div class=\"col-12\"><h2 class=\"mb-3\">Тағы да жаңартулар</h2><p>Таңдаулы мақалалар енді «Мақалалар менеджері» көрінісін ортақ пайдаланады.</p></div></div><div class=\"row align-items-center pt-4\"><div class=\"col-12\"><h3>Егер өткізіп алсаңыз</h3><p>Joomla 6 жақсырақ қауіпсіздік пен өнімділік үшін The Update Framework (TUF) арқылы автоматты жаңартуларды қолдайды.<br>Автоматты жаңарту параметрлерін <em>Joomla жаңарту</em> конфигурация бөлімінен табасыз.</p></div></div><div class=\"row align-items-center pt-4\"><div class=\"col-12\"><h3>Басқа жақсартулар мен түзетулер</h3><ul class=\"mb-3\"><li>Әкімшінің тіркелуін растау туралы хабарландыру хаты <a href=\"https://github.com/joomla/joomla-cms/pull/45802\" target=\"_blank\" rel=\"noopener noreferrer\">PR#45802</a></li><li>TinyMCE-дегі сурет диалогының класс тізіміне өз кластарын қосу <a href=\"https://github.com/joomla/joomla-cms/pull/45676\" target=\"_blank\" rel=\"noopener noreferrer\">PR#45676</a></li><li>Тегті жаппай жою мүмкіндігі қосылды <a href=\"https://github.com/joomla/joomla-cms/pull/40613\" target=\"_blank\" rel=\"noopener noreferrer\">PR#40613</a></li><li>Және көптеген ішкі жақсартулар...</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_0_TITLE="Басқа мүмкіндіктер"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_1_DESCRIPTION="<h3>Joomla 6.0 шығарылымы туралы ақпарат</h3><p><a title=\"Шығарылым туралы ақпарат\" href=\"https://6.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">Шығарылым туралы ақпаратты 6.joomla.org сайтынан қараңыз</a></p><hr><h3>Анықтама және ақпарат</h3><p>Мұнда сізге көмектесетін көптеген ресурстар, сондай-ақ қосымша ресурстарға, құжаттамаға, қолдауға және Joomla жұмысына қатысу жолдарына сілтемелер бар.</p>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_1_TITLE="Қосымша ақпарат және анықтама"
