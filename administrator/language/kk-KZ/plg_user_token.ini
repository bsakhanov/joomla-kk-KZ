PLG_USER_TOKEN="Пайдаланушы — Joomla API токені"
PLG_USER_TOKEN_COPY="Көшіру"
PLG_USER_TOKEN_COPY_DESC="Алмасу буферіне көшіру"
PLG_USER_TOKEN_COPY_FAIL="Токенді көшіру мүмкін болмады."
PLG_USER_TOKEN_COPY_SUCCESS="Токен көшірілді."
PLG_USER_TOKEN_ENABLED_DESC="Осы токенмен сайтыңызға қолжетімділікті уақытша болдырмау үшін «Жоқ» күйіне орнатыңыз."
PLG_USER_TOKEN_ENABLED_LABEL="Қосу"
PLG_USER_TOKEN_GROUP_DESC="Joomla API қолданбасына (сайтыңызға қашықтан қолжетімділік) аутентификациялау үшін пайдаланылатын қауіпсіздік токендерін басқарыңыз. Бұл не үшін екенін білмесеңіз, ол қажет емес және бұл параметрлерді елемеуге болады."
PLG_USER_TOKEN_GROUP_LABEL="Joomla API токені"
PLG_USER_TOKEN_NOTOKENFOROTHERPEOPLE_DESC="Өзіңізден басқа пайдаланушылардың токенін көре алмайсыз. Дегенмен, мысалы, олардың токені рұқсатсыз тұлғаларға таралып кетті деген күдік болғанда, олардың токенін қосуға, өшіруге немесе қалпына келтіруге болады."
PLG_USER_TOKEN_RESET_DESC="Ескісін ауыстыратын жаңа токенді жасау үшін «Иә» күйіне орнатып, пайдаланушы профилін сақтаңыз."
PLG_USER_TOKEN_RESET_LABEL="Қалпына келтіру"
PLG_USER_TOKEN_SAVEME_DESC="Сізде әлі токен жоқ. Токенді жасау үшін пайдаланушы профилін сақтаңыз. Токенді көру және басқару үшін осы бетке қайта оралыңыз."
PLG_USER_TOKEN_SAVEMEFOROTHERPEOPLE_DESC="Бұл пайдаланушыда әлі токен жоқ. Оның профилін сақтасаңыз, жаңа токен жасалады, бірақ қауіпсіздік себептері бойынша оны көре алмайсыз. Оның токенін қосуға, өшіруге немесе қалпына келтіруге болады."
PLG_USER_TOKEN_TOKEN_DESC="Бұл — сіздің токеніңіз. Оны Joomla API қолданбасы арқылы сайтыңызға қашықтан қолжетімділікті талап ететін үшінші тарап қолданбаларында пайдаланыңыз."
PLG_USER_TOKEN_TOKEN_LABEL="Токен"
PLG_USER_TOKEN_XML_DESCRIPTION="Joomla API қолданбасына (сайтыңызға қашықтан қолжетімділік) аутентификациялау үшін пайдаланылатын қауіпсіздік токендерін басқаруға мүмкіндік береді. Бұл токендер қатаң жеке болып табылады. Өз токеніңізді көре аласыз, ал басқа пайдаланушылардың токендерін тек өшіруге немесе қалпына келтіруге болады."
