PLG_SYSTEM_WEBAUTHN_ERR_NO_BROWSER_SUPPORT="Кешіріңіз, браузеріңіз құпиясөзсіз кіруге арналған passkey стандартын қолдамайды немесе сайт браузеріңіз сенетін сертификаттау орталығы қол қойған жарамды сертификатпен HTTPS арқылы ұсынылмайды. Бұл сайтқа пайдаланушы аты мен құпиясөзіңізбен кіруіңіз керек."
PLG_SYSTEM_WEBAUTHN_ERR_NO_STORED_CREDENTIAL="Passkey-іңіз үшін сақталған тіркелгі деректері табылмады."
PLG_SYSTEM_WEBAUTHN_ERR_USER_REMOVED="Бұл passkey-дің пайдаланушысы осы сайтта енді жоқ сияқты."
PLG_SYSTEM_WEBAUTHN_ERR_XHR_INITCREATE="Сайтыңыздан passkey тіркеу ақпаратын алу мүмкін болмады."
PLG_SYSTEM_WEBAUTHN_FIELD_ATTESTATION_SUPPORT_DESC="Passkey арқылы кіру үшін тек тексеріле алатын криптографиялық қолтаңбасы бар passkey-лерге ғана рұқсат ету. Жоғары қауіпсіздік орталары үшін қатаң ұсынылады. PHP-ге жүйелік уақытша каталогқа жазу мүмкіндігі және OpenSSL кеңейтімі қажет. Кейбір арзанырақ, сертификатталмаған passkey-лердің мүлде жұмыс істеуіне кедергі болуы мүмкін. Оны өшіру Joomla-ға пайдаланатын passkey-дің өндірушісі мен моделін анықтауға да кедергі жасайды (passkey атауының жанында иконка көрсетілмейді)."
PLG_SYSTEM_WEBAUTHN_FIELD_ATTESTATION_SUPPORT_LABEL="Attestation қолдауы"
PLG_SYSTEM_WEBAUTHN_FIELD_DESC="Passkey арқылы құпиясөзсіз кіру әдістерін басқаруға мүмкіндік береді. Сізге қолдау көрсетілетін браузер мен passkey қажет (мысалы, FIDO2 сертификатталған қауіпсіздік кілті бар Google Chrome немесе Firefox).<br><br><strong>MacOS/iOS/watchOS:</strong> Touch/Face ID.<br><strong>Windows:</strong> Hello (саусақ ізі / бет тану / PIN).<br><strong>Android:</strong> биометриялық экран құлпы.<br><br>Қосымша ақпаратты <a href=\"https://guide.joomla.org/user-manual/users/users-webauthn-passwordless-login\" target=\"_blank\" rel=\"noopener noreferrer\">Passkey арқылы құпиясөзсіз кіру құжаттамасынан</a> табуға болады."
