PLG_SYSTEM_WEBAUTHN="Жүйе — Passkey арқылы кіру (құпиясөзсіз)"
PLG_SYSTEM_WEBAUTHN_CANNOT_ADD_FOR_A_USER="Пайдаланушылардың атынан passkey қосуға немесе жоюға болмайды. Пайдаланушылар жүйеге кіріп, өз құрылғыларын өздері баптауы керек."
PLG_SYSTEM_WEBAUTHN_DESCRIPTION="Passkey арқылы құпиясөзсіз аутентификацияны қосады. Пайдаланушы профилін өңдеу құралындағы passkey қойындысы мен passkey арқылы кіру түймелері тек пайдаланушы сайтқа HTTPS арқылы кірсе ғана көрсетілетінін ескеріңіз. Passkey тіркеу және олармен сайтқа кіру тек сайт пайдаланушы браузері сенетін сертификаттау орталығы қол қойған жарамды сертификатты қолданғанда ғана жұмыс істейді."
PLG_SYSTEM_WEBAUTHN_ERR_AJAX_INVALIDACTION="Жарамсыз ajax әрекеті"
PLG_SYSTEM_WEBAUTHN_ERR_CANNOT_FIND_USERNAME="Кіру модулінде пайдаланушы аты өрісі табылмады. Кешіріңіз, басқа кіру модулін пайдаланбасаңыз, құпиясөзсіз аутентификация бұл сайтта жұмыс істемейді."
PLG_SYSTEM_WEBAUTHN_ERR_CANT_STORE_FOR_GUEST="Қонақ пайдаланушы үшін тіркелгі деректерін сақтау мүмкін емес!"
PLG_SYSTEM_WEBAUTHN_ERR_CORRUPT_STORED_CREDENTIAL="Пайдаланушы тіркелгіңіз үшін сақталған тіркелгі деректері бүлінген. Басқа әдіспен кіріп, passkey-ді жойып, қайта қосыңыз."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_INVALID_LOGIN_REQUEST="Құпиясөзсіз кіру сұрауы жарамсыз. Бірдеңе бұзылған немесе бұл сайтты бұзуға әрекет."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_INVALID_PK="Passkey тіркеу сәтсіз аяқталды. Браузерден алынған passkey жауабы сервер берген ашық кілтке сәйкес келмейді. Бұл біреу сізді бұзуға тырысқанын немесе бірдеңенің бұзылғанын білдіреді."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_INVALID_USER="Қауіпсіздік себептері бойынша басқа пайдаланушының атынан passkey тіркеуге болмайды."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_NO_ATTESTED_DATA="Бірдеңе дұрыс болмады, бірақ қате туралы қосымша ақпарат қазір жоқ. Passkey тіркеуді қайталап көріңіз."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_NO_PK="Сервер passkey тіркеу үшін ашық кілт бермеді, бірақ браузерден passkey тіркеу сұрауын қандай да бір жолмен алды. Бұл біреу сізді бұзуға тырысқанын немесе бірдеңенің бұзылғанын білдіреді."
PLG_SYSTEM_WEBAUTHN_ERR_CREDENTIAL_ID_ALREADY_IN_USE="Тіркелгі деректерін сақтау мүмкін емес. Бұл тіркелгі деректерін басқа пайдаланушы әлдеқашан пайдаланып жатыр."
PLG_SYSTEM_WEBAUTHN_ERR_EMPTY_USERNAME="Passkey арқылы кіру түймесін таңдамас бұрын пайдаланушы атыңызды (бірақ құпиясөзді ЕМЕС) енгізу керек."
PLG_SYSTEM_WEBAUTHN_ERR_INVALID_USERNAME="Көрсетілген пайдаланушы аты осы сайтта құпиясөзсіз кіруді қосқан тіркелгіге сәйкес келмейді."
