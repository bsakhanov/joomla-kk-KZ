COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_ACTION="«Load Balancer артында» параметрін қосу"
COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_DESCRIPTION="<p>Жүктемені теңестіргіштер (Load Balancer) мен кері проксилер артында орналасқан Joomla сайттары үшін Joomla 3.9.26 нұсқасында жаңа жалпы конфигурация параметрі енгізілді.</p><p>Бұл параметр қосылғанда жүктемені теңестіргіш/кері прокси сайт келушілерінің нақты IP-мекенжайын беретін болады. Бұл IP-мекенжай әрекеттер журналында және мақалаларға берілген дауыстарды есепке алуда (бұл мүмкіндіктер қосылған болса) пайдаланылады.</p><p><strong>Бұл мүмкіндікті тек жүктемені теңестіргіш/кері прокси артындағы сайттар ғана қосқан жөн.</strong></p>"
COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_TITLE="Серверді жаңа баптау: «Load Balancer артында»"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_AUTOINDEX_DESCRIPTION="<p>3.9.22 нұсқасына дейін әдепкі htaccess.txt файлында каталогтарды тізімдеуді өшіруге арналған қате код болған. Қауіпсіздік тобы қажетті өзгерістерді бар .htaccess файлына қолмен енгізуді ұсынады, өйткені бұл файлды автоматты түрде жаңартуға болмайды.</p><p>Ескі код:</p><pre>&lt;IfModule autoindex&gt;\n  IndexIgnore *\n&lt;/IfModule&gt;</pre><p>Жаңа код:</p><pre>&lt;IfModule mod_autoindex.c&gt;\n  IndexIgnore *\n&lt;/IfModule&gt;</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_AUTOINDEX_TITLE=".htaccess жаңарту: каталогтардың тізімі туралы"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_BROTLI_DESCRIPTION="<p>5.1.0 нұсқасына дейін әдепкі htaccess.txt файлы Brotli қысуын қолдамайтын. Бұл Joomla Brotli қысуын пайдаланатын серверде орнатылғанда қосарлы қысу қателеріне әкелуі мүмкін. Қажетті өзгерістерді бар .htaccess файлына қолмен енгізу керек, өйткені бұл файлды автоматты түрде жаңартуға болмайды.</p><p>Ескі код:</p><pre>RewriteRule \"\.css\.gz$\" \"-\" [T=text/css,E=no-gzip:1]<br>RewriteRule \"\.js\.gz$\" \"-\" [T=text/javascript,E=no-gzip:1]</pre><p>Жаңа код:</p><pre>RewriteRule \"\.css\.gz$\" \"-\" [T=text/css,E=no-gzip:1,E=no-brotli:1]<br>RewriteRule \"\.js\.gz$\" \"-\" [T=text/javascript,E=no-gzip:1,E=no-brotli:1]</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_BROTLI_TITLE=".htaccess жаңарту: Brotli қысуы"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_SETCE_DESCRIPTION="<p>4.2.9 нұсқасына дейін әдепкі htaccess.txt файлында HTTP-тің «Content-Encoding» тақырыбын қосуға арналған қате код болған. Бұл Joomla ішкі каталогқа орнатылғанда және осы каталогта да, оның ата-аналық каталогында да осы кодты қамтитын .htaccess файлы болғанда қосарлы кодтау қателеріне әкелуі мүмкін. Қажетті өзгерістерді бар .htaccess файлына қолмен енгізу керек, өйткені бұл файлды автоматты түрде жаңартуға болмайды.</p><p>Ескі код:</p><pre>Header append Content-Encoding gzip</pre><p>Жаңа код:</p><pre>Header set Content-Encoding gzip</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_SETCE_TITLE=".htaccess жаңарту: Content-Encoding тақырыбын орнату туралы"
