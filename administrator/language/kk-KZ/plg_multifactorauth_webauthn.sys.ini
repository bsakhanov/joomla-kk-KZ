PLG_MULTIFACTORAUTH_WEBAUTHN="Көпфакторлы аутентификация — Passkey"
PLG_MULTIFACTORAUTH_WEBAUTHN_XML_DESCRIPTION="Браузер passkey-лерін көпфакторлы аутентификация әдісі ретінде пайдаланыңыз. Оны барлық заманауи браузерлер қолдайды. Көптеген браузерлер құпиясөзбен және/немесе биометриямен (саусақ ізі сканері, бет сканері, &hellip;) қорғалған құрылғыға тән аутентификацияны ұсынады."
