PLG_EDITORS-XTD_FIELDS_XML_DESCRIPTION="<p>Редактор аймағына арнайы өрісті енгізу түймесін көрсетеді. Өрісті таңдауға мүмкіндік беретін қалқымалы терезені көрсетеді.</p><p><strong>Назар аударыңыз!</strong>: <a href=\"index.php?option=com_plugins&view=plugins&filter[folder]=content\">Контент — Өрістер</a> плагині қосылмаса, арнайы өріс көрсетілмейді.</p>"
