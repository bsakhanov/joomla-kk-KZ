PLG_SYSTEM_SHORTCUT="Жүйе — Пернелер тіркесімдері"
PLG_SYSTEM_SHORTCUT_XML_DESCRIPTION="<p>Әкімшілік бөлікте пернелер тіркесімдерін қосады, оларды басқа плагиндер ұсына алады, және мына тіркесімдер тізімін тікелей қамтиды:</p><ul class=\"list-unstyled\"><li><kbd>J</kbd> <small>содан кейін</small> <kbd>A</kbd> Сақтау</li><li><kbd>J</kbd> <small>содан кейін</small> <kbd>S</kbd> Сақтау және жабу</li><li><kbd>J</kbd> <small>содан кейін</small> <kbd>Q</kbd> Болдырмау</li><li><kbd>J</kbd> <small>содан кейін</small> <kbd>N</kbd> Жасау</li><li><kbd>J</kbd> <small>содан кейін</small> <kbd>F</kbd> Іздеу</li><li><kbd>J</kbd> <small>содан кейін</small> <kbd>O</kbd> Параметрлер</li><li><kbd>J</kbd> <small>содан кейін</small> <kbd>H</kbd> Анықтама</li><li><kbd>J</kbd> <small>содан кейін</small> <kbd>M</kbd> Менюді ауыстыру</li><li><kbd>J</kbd> <small>содан кейін</small> <kbd>X</kbd> Шолу</li><li><kbd>J</kbd> <small>содан кейін</small> <kbd>D</kbd> Басты тақта</li></ul>"
