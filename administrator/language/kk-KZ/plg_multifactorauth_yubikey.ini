PLG_MULTIFACTORAUTH_YUBIKEY="Көпфакторлы аутентификация — YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_CAPTIVE_PROMPT="Төмендегі мәтін жолағын басыңыз. Содан кейін YubiKey-ді құрылғының USB портына салып, YubiKey коды жасалуы үшін оның алтын түсті дискісіне немесе алтын түсті алаңына (моделіне байланысты) тиіңіз. Егер NFC қолдайтын телефонды немесе планшетті NFC қолдайтын YubiKey-мен пайдалансаңыз, оның орнына YubiKey-ді телефонның немесе планшеттің NFC оқу аймағына жақындатыңыз."
PLG_MULTIFACTORAUTH_YUBIKEY_CODE_LABEL="YubiKey коды"
PLG_MULTIFACTORAUTH_YUBIKEY_ERR_VALIDATIONFAILED="Жарамды YubiKey құпия кодын енгізбедіңіз немесе YubiCloud серверлеріне қазір қол жеткізу мүмкін емес."
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_AFTERSETUP_INSTRUCTIONS="YubiKey-ді әлдеқашан бапталғансыз (<code>%s</code> деп басталатын кодтарды жасайтыны). Бұл беттен тек оның атауын өзгертуге болады."
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_SETUP_INSTRUCTIONS="Төменге <a href=\"https://www.yubico.com\" target=\"_blank\" rel=\"noopener noreferrer\">YubiKey</a> жасаған кодты енгізіп, «Растау» түймесін басыңыз немесе тиіңіз. YubiKey-дің бірегей идентификациялық коды болып табылатын алғашқы он екі таңба сақталады."
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_SETUP_LABEL="YubiKey идентификациясы"
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_SETUP_PLACEHOLDER="YubiKey кодын енгізіңіз"
PLG_MULTIFACTORAUTH_YUBIKEY_METHOD_TITLE="YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_SHORTINFO="YubiKey қауіпсіз аппараттық токендерін пайдаланыңыз."
PLG_MULTIFACTORAUTH_YUBIKEY_XML_DESCRIPTION="Сайт пайдаланушыларына YubiKey қауіпсіз аппараттық токенін пайдаланып көпфакторлы аутентификацияны пайдалануға мүмкіндік береді. Пайдаланушыларға <a href=\"https://www.yubico.com\" target=\"_blank\" rel=\"noopener noreferrer\">www.yubico.com</a> сайтынан алуға болатын өз YubiKey-і қажет. Көпфакторлы аутентификацияны пайдалану үшін пайдаланушылар өз профилін өңдеп, көпфакторлы аутентификацияны қосуы керек."
