JLIB_RULES_SETTING_NOTES_COM_CONTENT="Әрекет мәндерінің өзгерістері тек осы компонентке қолданылады.<br><strong>Мұраланған</strong> — сайттың жалпы баптауларындағы немесе ата-аналық пайдаланушылар тобындағы әрекет мәні қолданылады.<br><strong>Рұқсат етілген</strong> — егер сайттың жалпы баптауларындағы немесе ата-аналық пайдаланушылар тобындағы мәнмен қайшылық болмаса, топ пайдаланушылары компонентте әрекетті орындай алады.<br><strong>Тыйым салынған</strong> — сайттың жалпы баптауларындағы немесе ата-аналық пайдаланушылар тобындағы мәнге қарамастан, топ пайдаланушылары компонентте әрекетті орындай алмайды." ; Alternate language strings for the rules form field
JLIB_RULES_SETTING_NOTES_ITEM_COM_CONTENT_ARTICLE="Әрекет мәндерінің өзгерістері тек осы мақалаға қолданылады.<br><strong>Мұраланған</strong> — сайттың жалпы баптауларындағы, ата-аналық пайдаланушылар тобындағы немесе категориядағы әрекет мәні қолданылады.<br><strong>Рұқсат етілген</strong> — егер сайттың жалпы баптауларындағы, ата-аналық пайдаланушылар тобындағы немесе категориядағы мәнмен қайшылық болмаса, топ пайдаланушылары мақала бойынша әрекетті орындай алады.<br><strong>Тыйым салынған</strong> — сайттың жалпы баптауларындағы, ата-аналық пайдаланушылар тобындағы немесе категориядағы мәнге қарамастан, топ пайдаланушылары мақала бойынша әрекетті орындай алмайды." ; Alternate language strings for the rules form field

