PLG_AUTHENTICATION_COOKIE_PRIVACY_CAPABILITY_COOKIE="«Мені есте сақтау» мүмкіндігін қолдайтын плагинмен, мысалы, «Жүйе — Мені есте сақтау» плагинімен бірге бұл плагин сайтқа кіру кезінде «Мені есте сақтау» құсбелгісі таңдалса, пайдаланушы браузерінде cookie жасайды. Бұл cookie `joomla_remember_me` префиксі арқылы анықталады және пайдаланушылар сайтқа кіргенде әлі жүйеге кірмеген болса, оларды автоматты түрде кіргізу үшін қолданылады."
PLG_AUTHENTICATION_COOKIE_XML_DESCRIPTION="<p>Joomla-ның cookie негізіндегі пайдаланушы аутентификациясын өңдейді.</p><p><strong>Назар аударыңыз! Кемінде бір басқа аутентификация плагині қосулы болуы керек.</strong><br>Cookie арқылы кіруді іске асыру үшін «Жүйе — Мені есте сақтау» сияқты плагин де қажет.</p>"
