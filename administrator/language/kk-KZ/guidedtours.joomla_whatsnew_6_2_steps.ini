COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_STEP_0_DESCRIPTION="<h3>Joomla 6.2 шығарылымының толық сипаттамасы</h3><p><a title=\"Шығарылымның толық сипаттамасы\" href=\"https://www.joomla.org/announcements.html\" target=\"_blank\" rel=\"noopener noreferrer\">Шығарылымның толық сипаттамасын joomla.org сайтында қараңыз</a></p><hr><h3>Анықтама және ақпарат</h3><p class=\"mb-3\">Мұнда сізге көмектесетін көптеген ресурстар, сондай-ақ қосымша ресурстарға, құжаттамаға, қолдауға және Joomla жобасына қалай қатысуға болатынына сілтемелер бар.</p><p><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/help_index.jpg\" alt=\"Жаңа анықтама индексі\" width=\"450\" height=\"275\"></p>"
