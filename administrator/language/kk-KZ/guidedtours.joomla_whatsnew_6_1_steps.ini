COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_STEP_0_DESCRIPTION="<h3>Joomla 6.1 шығарылымының толық ескертпелері</h3><p><a title=\"Шығарылымның толық ескертпелері\" href=\"https://www.joomla.org/announcements.html\" target=\"_blank\" rel=\"noopener noreferrer\">Толық ескертпелерді joomla.org сайтынан қараңыз</a></p><hr><h3>Анықтама және ақпарат</h3><p>Мұнда сізге көмектесетін көптеген ресурстар, сондай-ақ қосымша ресурстарға, құжаттамаға, қолдауға және Joomla жұмысына қатысу жолдарына сілтемелер бар.</p>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_STEP_0_TITLE="Қосымша ақпарат және анықтама"
