COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_TITLE="Joomla-ға қош келдіңіз"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_DESCRIPTION="<p>Бұл тур Joomla-мен жұмысты қалай бастау керектігі туралы қысқаша шолу береді!</p><p>Сіз Joomla әкімшілік аймағындасыз, ол «<strong>бэкенд</strong>» деп те аталады.<br>Мұнда бүкіл Joomla сайтын баптап, басқарасыз.</p><p><strong>Көбірек білгіңіз келе ме?</strong></p><p>Турды бастайық және сайтыңызды Joomla мүмкіндіктерімен құрайық!</p>"
