PLG_SYSTEM_STATS_MSG_JOOMLA_WANTS_TO_SEND_DATA="Біз Joomla! бағдарламасының пайдаланушыларымыздың сервер параметрлерімен үйлесімділігін арттырғымыз келеді. Сондықтан орнатылымдар базасын және соңғы пайдаланушылардың ортасын жақсырақ түсіну үшін сайтыңыздан анонимді деректер қажет. Барлық деректер анонимделеді және тек Joomla! басқаратын орталық серверге жіберіледі. Бұл параметрлерді кейін «Плагиндер &rarr; Жүйе — Joomla! статистикасы» бөлімінен өзгертуге болады."
