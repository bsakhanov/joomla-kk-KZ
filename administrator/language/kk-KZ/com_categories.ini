JLIB_RULES_SETTING_NOTES_ITEM="Әрекет мәндерінің өзгерістері осы және еншілес категорияларға қолданылады.<br><strong>Мұраланған</strong> — сайттың жалпы баптауларындағы немесе ата-аналық пайдаланушылар тобындағы әрекет мәні қолданылады.<br><strong>Рұқсат етілген</strong> — егер сайттың жалпы баптауларындағы немесе ата-аналық пайдаланушылар тобындағы мәнмен қайшылық болмаса, топ пайдаланушылары категорияда әрекетті орындай алады.<br><strong>Тыйым салынған</strong> — сайттың жалпы баптауларындағы немесе ата-аналық пайдаланушылар тобындағы мәнге қарамастан, топ пайдаланушылары категорияда әрекетті орындай алмайды."
