PLG_MULTIFACTORAUTH_EMAIL="Көпфакторлы аутентификация — Электрондық поштамен аутентификация коды"
PLG_MULTIFACTORAUTH_EMAIL_CONFIG_FORCE_ENABLE_DESC="Электрондық поштамен аутентификация кодын <em>барлық</em> пайдаланушылар үшін нұсқа ретінде автоматты түрде қосу керек пе? Негізгі аутентификаторына қолжетімділігін жоғалтқан және сақтық кодтардың көшірмесін сақтамаған пайдаланушыларға қосалқы жол беру үшін пайдалы, бірақ бақылау мен қауіпсіздік дәрежесі біршама төмендейді."
PLG_MULTIFACTORAUTH_EMAIL_CONFIG_FORCE_ENABLE_LABEL="Мәжбүрлі қосу"
