PLG_MULTIFACTORAUTH_EMAIL_CONFIG_TIMESTEP_DESC="Жаңа код осынша минут сайын жасалады. Жасалған код кемінде осыншама уақыт және ең көбі екі есе ұзақ жарамды болатынын ескеріңіз. Бұл кезең неғұрлым ұзақ болса, кодты брутфорс арқылы іріктеу ықтималдығы соғұрлым жоғары, демек, сайттың қауіпсіздігі соғұрлым төмен болады. 2 минуттық кезең ыңғайлылық пен қауіпсіздік арасындағы жақсы ымыра болып табылады."
