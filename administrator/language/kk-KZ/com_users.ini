COM_USERS_POSTINSTALL_MULTIFACTORAUTH_BODY="<p>Joomla 4.2 нұсқасында интерактивті әдістерді (Apple Touch/Face ID, Windows Hello, Android-тағы биометриялық экран блогы) пайдалану немесе растау кодтарын электрондық пошта арқылы жіберу көмегімен сайт пайдаланушыларының есептік жазбаларының қауіпсіздігін арттыруға арналған жетілдірілген <a href=\"https://en.wikipedia.org/wiki/Multi-factor_authentication\" target=\"_blank\" rel=\"noopener noreferrer\">көпфакторлы аутентификация</a> ұсынылды.</p><p>Joomla-ның алдыңғы нұсқасындағы екіфакторлы аутентификациядан айырмашылығы, пайдаланушыларға енді кіру бетінде логин мен парольмен бірге құпия кодты енгізудің қажеті жоқ. Көпфакторлы аутентификация жүйеге кіргеннен кейін жеке бетте жүзеге асырылады, бұл сайт пайдаланушыларының есептік жазбаларын <a href=\"https://en.wikipedia.org/wiki/Phishing\" target=\"_blank\" rel=\"noopener noreferrer\">фишингтен</a> қорғауға мүмкіндік береді. Көпфакторлы аутентификация аяқталмайынша, пайдаланушылар сайтты пайдалана алмайды.</p>"
