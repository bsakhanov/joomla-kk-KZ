COM_ACTIONLOGS_POSTINSTALL_BODY="<p>Joomla 3.9.0 шығарылғаннан бастап қолдау көрсетілетін кеңейтімдердегі пайдаланушылардың барлық әкімшілік әрекеттерін журналға жазуға болады. Енді кім, не және қашан істегенін оңай көруге болады.</p><p>Журналдарды Joomla ішінде қарауға немесе сыртқы пайдалану үшін экспорттауға болады.</p><p>Қосымша ақпаратты <a href='https://guide.joomla.org/user-manual/users/users-user-actions-log' target='_blank' rel='noopener noreferrer'>пайдаланушы әрекеттері журналының құжаттамасынан</a> қараңыз.</p>"
