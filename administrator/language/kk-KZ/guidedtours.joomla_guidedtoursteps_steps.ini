COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_COUNTER_TITLE="Қадам санағышының нөмірін таңдаңыз"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_COUNTER_DESCRIPTION="Қадам қосу үшін нөмірді таңдаңыз. Нөмір тур үшін осы уақытқа дейін жасалған қадамдар санын білдіреді."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_NEW_TITLE="Категория жасау"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_NEW_DESCRIPTION="Жаңа қадам жасау үшін «Жасау» түймесін басыңыз."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_TITLE_TITLE="Қадамға тақырып қосыңыз"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_TITLE_DESCRIPTION="Қадамға міндетті тақырыпты енгізіңіз. Бұл әдетте пайдаланушы орындауы тиіс әрекет."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_DESCRIPTION_TITLE="Қадамдық түсініктеме қосыңыз"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_DESCRIPTION_DESCRIPTION="Мазмұн пайдаланушыға қадам туралы түсініктеме беруі керек."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_STATUS_TITLE="Күйі"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_STATUS_DESCRIPTION="Қадамның жариялану күйін таңдаңыз."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_POSITION_TITLE="Орынды таңдаңыз"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_POSITION_DESCRIPTION="Бұл қалқымалы терезенің беттегі мақсатты элементке қатысты орны. Нақты мақсат болмағанда «Ортада» қолданылады."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_TARGET_TITLE="Мақсатты элементті енгізіңіз"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_TARGET_DESCRIPTION="Бұл — осы қадам мақсат ететін беттегі элемент. Ол элементті көрсету үшін CSS пайдаланатын синтаксисті қолданады.<br>Мысалы, <code>#jform_title</code> id-і «jform_title» болатын элементті мақсат етеді."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_TYPE_TITLE="Түрі"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_TYPE_DESCRIPTION="Бұл — жасағыңыз келетін қадамның түрі. Тур өзара әрекеттесусіз жалғасуы үшін «Келесі», басқа бетке өту үшін «Қайта бағыттау», пайдаланушыдан деректер сұрау үшін «Интерактивті»."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_SAVECLOSE_TITLE="«Сақтау және жабу» түймесін басыңыз"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_SAVECLOSE_DESCRIPTION="Қадамды сақтап, жабыңыз."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_CONGRATULATIONS_TITLE="Құттықтаймыз!"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_CONGRATULATIONS_DESCRIPTION="Сіз оқыту турына арналған қадам жасадыңыз."
