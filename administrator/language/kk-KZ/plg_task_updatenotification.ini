PLG_TASK_UPDATENOTIFICATION_EMAIL_DESC="Жаңарту туралы хабарландыру хаттарын алатын электрондық пошта мекенжайларының үтірмен бөлінген тізімі. Тізімдегі мекенжайлар супер пайдаланушы құқығы бар сайттың бар пайдаланушыларына тиесілі БОЛУЫ ТИІС. Тізімдегі мекенжайлардың ешқайсысы супер пайдаланушыларға тиесілі болмаса немесе тізім бос қалдырылса, жаңарту туралы хабарландыру хатын осы сайттың барлық супер пайдаланушылары алады."
PLG_TASK_UPDATENOTIFICATION_EMAIL_LBL="Супер пайдаланушылардың электрондық пошта мекенжайлары"
PLG_TASK_UPDATENOTIFICATION_SEND_TITLE="Joomla! жаңарту туралы хабарландыру"
PLG_TASK_UPDATENOTIFICATION_SEND_DESC="Бұл тапсырма Joomla!-ның жаңа нұсқаларының қолжетімділігін мезгіл-мезгіл тексереді. Жаңасы табылғанда, жаңартуды еске салатын хат жібереді. Хатты <a href=\"index.php?option=com_mails&view=templates&filter[extension]=plg_task_updatenotification\">Жүйе &rarr; Хат шаблондары</a> бөлімінде өзгертуге болады."
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_DESC="Жаңарту туралы хабарландыру хаттарының тілін таңдаңыз. Оларды сол кездегі сайт тілінде жіберу үшін «Авто» күйіне орнатыңыз."
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_LBL="Хат тілі"
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_NONE="Автоматты түрде"
PLG_TASK_UPDATENOTIFICATION_EMAIL_BODY="Бұл хатты Joomla! жобасы жібермеген. Оны сіздің өз сайтыңыз автоматты түрде жібереді,\n{SITENAME} - {URL} \n\n================================================================================\nЖаңарту туралы ақпарат\n================================================================================\n\nСайтыңыз Joomla!-ның жаңартылған нұсқасы қолжетімді екенін анықтады.\n\nҚазір орнатылған Joomla! нұсқасы: {CURVERSION}\nОрнатуға қолжетімді Joomla! нұсқасы: {NEWVERSION}\n\nБұл хатты сайтыңыз осы жағдайды еске салу үшін жібереді.\nJoomla! жобасы сайтыңыздағы Joomla!-ның қолжетімді жаңартулары туралы сізбен ешқашан тікелей байланыспайды.\n\n================================================================================\nЖаңартуды орнату нұсқаулығы\n================================================================================\n\n{SITENAME} сайтына жаңартуды орнату үшін мына сілтемені таңдаңыз. (URL сілтеме болмаса, оны көшіріп, браузеріңізге қойыңыз).\n\nЖаңарту сілтемесі: {LINK}\n\nШығарылым жаңалықтарын мына жерден табуға болады: {RELEASENEWS}\n\n================================================================================\nМен бұл хатты неге аламын?\n================================================================================\n\nБұл хатты сайтыңызды іске қосатын бағдарлама — Joomla! ұсынатын плагин автоматты түрде жіберді.\nБұл плагин Joomla!-ның жаңартылған нұсқаларын іздейді және әкімшілеріне электрондық пошта арқылы хабарландыру жібереді.\nБағдарламаны жаңартқанға немесе бұл хаттарды өшіргенге дейін сайтыңыздан осындай бірнеше хат аласыз.\n\nБұл хаттарды өшіру үшін сайтыңыздың «Плагиндер менеджерінде» «Тапсырма — Joomla! жаңарту туралы хабарландыру» плагинін жариялаудан алыңыз.\n\nЕгер Joomla! дегеннің не екенін және не істеу керектігін түсінбесеңіз, Joomla! жобасына хабарласпаңыз.\nОлар сізге бұл хатты жібермейді және сізге көмектесе алмайды. Оның орнына сайтты құрған немесе басқаратын адамға хабарласыңыз.\n\nЕгер сіз сайтты құрған немесе басқаратын адам болсаңыз, Joomla!-ны сайтқа орнатқанда немесе жаңартқанда бұл плагин автоматты түрде белсендірілген болуы мүмкін екенін ескеріңіз.\n\n================================================================================\nБұл хатты маған кім жіберді?\n================================================================================\n\nБұл хатты сізге өз сайтыңыз, {SITENAME}, жібереді"
; You can use the following merge codes:
; {NEWVERSION}		New Joomla! version, e.g. 1.2.3
; {CURVERSION}		Currently installed Joomla! version, e.g. 1.2.0
; {SITENAME}		Site name, as set in Global Configuration.
; {URL}			URL of the site's frontend page.
; {LINK}		Update URL (link to com_joomlaupdate, will request login if the Super User isn't already logged in).
; {RELEASENEWS}		URL to the release news on joomla.org
; \n			Newline character. Use it to start a new line in the email.
