JLIB_RULES_SETTING_NOTES_COM_CONFIG="Әрекет мәндерінің өзгерістері осы және еншілес пайдаланушылар топтарына, компоненттерге және сайттың бүкіл мазмұнына қолданылады.<br><strong>Мұраланған</strong> — ата-аналық пайдаланушылар тобындағы әрекет мәні қолданылады.<br><strong>Рұқсат етілген</strong> — егер ата-аналық пайдаланушылар тобындағы мәнмен қайшылық болмаса, топ пайдаланушылары әрекетті орындай алады.<br><strong>Тыйым салынған</strong> — ата-аналық пайдаланушылар тобындағы мәнге қарамастан, топ пайдаланушылары әрекетті орындай алмайды.<br><strong>Әрекет&#160;анықталмаған</strong> мәні тек Public пайдаланушылар тобына және тек сайттың жалпы баптауларында қолданылады. <strong>Әрекет&#160;анықталмаған</strong> таңдалған әрекеттің жиынтық мәні <strong>Тыйым салынған</strong> ретінде қаралады, бірақ оны еншілес топтар, компоненттер, категориялар және элементтер үшін қайта анықтауға болады." ; Alternate language strings for the rules form field
