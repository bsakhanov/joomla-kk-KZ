COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_NEW_TITLE="Категория жасау"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_NEW_DESCRIPTION="Жаңа тур жасау үшін «Жасау» түймесін басыңыз."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_TITLE_TITLE="Тақырыбы"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_TITLE_DESCRIPTION="Турға міндетті тақырыпты енгізіңіз."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_CONTENT_TITLE="Сипаттама"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_CONTENT_DESCRIPTION="Турды сипаттайтын мазмұнды енгізіңіз."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_COMPONENT_TITLE="Компонентті таңдаңыз"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_COMPONENT_DESCRIPTION="Туры іске қосылатын мүмкін турлар тізімінде басымдықпен көрсетілуі тиіс кеңейтімді (кеңейтімдерді) таңдаңыз. Мысалы, «Пайдаланушылар» кеңейтімі үшін тур жасасаңыз, «Пайдаланушылар» таңдаңыз. Тур әр бетте көрсетілуі үшін «Барлығы» таңдаңыз."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_URL_TITLE="URL мекенжайы"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_URL_DESCRIPTION="Тур басталуы тиіс беттің салыстырмалы URL-ын қосыңыз. Мысалы, турды «Пайдаланушылар» бетінде бастау үшін <em>administrator/index.php?option=com_users&view=users</em> енгізіңіз."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_AUTOSTART_TITLE="«Автоматты бастауды» ауыстыру"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_AUTOSTART_DESCRIPTION="<p>«Автоматты бастау» параметрін «Иә» күйіне орнату тиісті шарттар орындалған сәтте турды автоматты түрде іске қосады.</p><p>Бірнеше тур бірдей шарттарда автоматты түрде басталатын етіп орнатылса, тізімдегі тек бірінші тур тоқтатылғанға, аяқталғанға немесе өткізіп жіберілгенге дейін басталады.</p>"

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_SAVECLOSE_TITLE="«Сақтау және жабу» түймесін басыңыз"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_SAVECLOSE_DESCRIPTION="Турды сақтап, жабыңыз."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_CONGRATULATIONS_TITLE="Құттықтаймыз!"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_CONGRATULATIONS_DESCRIPTION="Сіз оқыту турын жасадыңыз. Енді тур үшін қадамдар жасау керек."
