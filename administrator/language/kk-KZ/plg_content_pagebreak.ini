PLG_CONTENT_PAGEBREAK_XML_DESCRIPTION="<p>Қосымша мазмұны бар беттелген мақаланы жасауға мүмкіндік береді.</p><p>Бет үзілімдерін әдетте WYSIWYG редакторының құралдар тақтасында орналасқан бет үзілімі түймесі арқылы енгізіңіз. Мақаладағы бет үзілімінің орны редакторда қарапайым көлденең сызық ретінде көрсетіледі.</p><p>Көрсетілетін мәтін таңдалған параметрлерге байланысты болады және тақырып, балама мәтін (болса) немесе бет нөмірлері болуы мүмкін.</p><p>HTML пайдаланылуы:<br>&lt;hr class=&quot;system-pagebreak&quot; /&gt;<br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;Беттің тақырыбы&quot; /&gt; немесе <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;Бірінші бет&quot; /&gt; немесе <br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;Беттің тақырыбы&quot; alt=&quot;Бірінші бет&quot; /&gt; немесе <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;Бірінші бет&quot; title=&quot;Беттің тақырыбы&quot; /&gt;</p>"
