PLG_MULTIFACTORAUTH_TOTP="Көпфакторлы аутентификация — Растау коды"
PLG_MULTIFACTORAUTH_TOTP_CAPTIVE_PROMPT="Аутентификатор қолданбасын немесе құпиясөз менеджерін ашып, осы сайтқа арналған алты таңбалы кодты төмендегі мәтін жолағына көшіріңіз, содан кейін «Тексеру» түймесін басыңыз. Егер бұл код сіз үшін автоматты түрде толтырылған болса, «Тексеру» түймесін басыңыз."
PLG_MULTIFACTORAUTH_TOTP_ERR_VALIDATIONFAILED="Жарамды растау кодын енгізбедіңіз. Аутентификатор қолданбасының баптауын тексеріп, құрылғыдағы уақыт пен уақыт белдеуінің дұрыс орнатылғанына көз жеткізіңіз."
PLG_MULTIFACTORAUTH_TOTP_LBL_LABEL="Растау коды"
PLG_MULTIFACTORAUTH_TOTP_LBL_SETUP_INSTRUCTIONS="Төмендегі ақпаратты пайдаланып растау кодын («аутентификатор коды» деп те аталады) баптаңыз. Аутентификатор қолданбасын (Google Authenticator, Authy, LastPass Authenticator және т.б.), сүйікті құпиясөз менеджеріңізді (1Password, BitWarden, Keeper, KeePassXC, Strongbox және т.б.) немесе кейбір жағдайларда браузеріңізді пайдалануға болады."
