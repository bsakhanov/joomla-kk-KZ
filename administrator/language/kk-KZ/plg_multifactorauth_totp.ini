PLG_MULTIFACTORAUTH_TOTP_LBL_SETUP_TABLE_SUBHEAD="Аутентификатор қолданбасында, құпиясөз менеджерінде немесе браузерде растау кодын баптау үшін мына балама әдістердің <em>біреуін</em> пайдаланыңыз."
