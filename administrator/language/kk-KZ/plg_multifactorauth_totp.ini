PLG_MULTIFACTORAUTH_TOTP_XML_DESCRIPTION="Сайт пайдаланушылары үшін аутентификатор қолданбасы (Google Authenticator, Authy, LastPass Authenticator және т.б.), құпиясөз менеджері (1Password, BitWarden, Keeper, KeePassXC, Strongbox және т.б.) немесе кейбір жағдайларда олардың браузері жасайтын алты таңбалы растау кодтарын пайдаланатын көпфакторлы аутентификация."
