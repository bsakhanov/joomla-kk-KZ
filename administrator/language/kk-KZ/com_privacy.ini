COM_PRIVACY_POSTINSTALL_BODY="<p>ЕО азаматтары үшін GDPR енгізілуімен және әлемнің басқа елдеріндегі ұқсас ережелермен пайдаланушының кез келген <strong>жеке ақпаратын</strong> сақтамас бұрын келісім сұрау қажет болуы мүмкін.</p><p>Joomla 3.9 сайттың құпиялылық саясатын жасауға және пайдаланушылардың келісімін жинауға көмектесетін жаңа мүмкіндіктерді ұсынады. Сонымен қатар пайдаланушылардың ақпарат сұрауларын, мысалы, олардың жеке деректерін сайттан жою сұрауларын басқаруға көмектесетін үдеріс бар.</p><p>Осы жаңа мүмкіндік туралы қосымша ақпаратты <a href='https://guide.joomla.org/user-manual/privacy' target='_blank' rel='noopener noreferrer'>«Жеке деректер» құжаттамасынан</a> қараңыз.</p>"
