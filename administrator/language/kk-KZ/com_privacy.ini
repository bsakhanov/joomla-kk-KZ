COM_PRIVACY_EMAIL_ADMIN_REQUEST_BODY_EXPORT_REQUEST="{URL} сайтының әкімшісі осы электрондық пошта мекенжайына қатысты жеке ақпаратты экспорттау сұрауын жасады. Қауіпсіздік шарасы ретінде бұл сіздің жеке ақпаратыңызды осы сайттан алуға арналған жарамды сұрау екенін растауыңыз керек.\n\nБұл қате болса, осы хатты елемеңіз — ештеңе болмайды.\n\nСұрауды растау үшін мына әрекеттердің бірін орындаңыз:\n\n1. Мына URL-ға өтіңіз: {TOKENURL}\n\n2. Токенді осы хаттан көшіріп, көрсетілген URL-ға өтіп, токенді формаға қойыңыз.\nURL: {FORMURL}\nТокен: {TOKEN}\n\nЕскерту: бұл токен хат жіберілген сәттен бастап тек 24 сағат бойы жарамды."
