COM_PRIVACY_CORE_CAPABILITY_COMMUNICATION_WITH_JOOMLA_ORG="Желі қосылымы болған кезде Joomla орнатылымы әртүрлі мүмкіндіктер үшін joomla.org серверлерімен байланысуға әрекет жасайды, оның ішінде:<ul><li>Joomla жүйесінің жаңартуларын тексеру</li><li>Joomla негізгі кеңейтімдері үшін анықтама экрандары</li><li>«Install from Web» қызметі (өз қалауымен қосылады)</li><li>Статистика жинау сервері (өз қалауымен қосылады)</li></ul>Кез келген HTTP сұрауындағыдай, сервердің IP-мекенжайы сұраудың бір бөлігі ретінде жіберіледі. Joomla өз серверлерінде деректерді қалай өңдейтіні туралы ақпарат алу үшін <a href=\"https://www.joomla.org/privacy-policy.html\" target=\"_blank\" rel=\"noopener noreferrer\">құпиялылық саясатымен</a> танысыңыз."
COM_PRIVACY_CORE_CAPABILITY_LOGGING_IP_ADDRESS="Joomla журналға жазу жүйесі келушінің IP-мекенжайын жазады, ол журнал файлдарына жазбаның түсуіне әкеледі. Бұл журнал файлдары Joomla сайтындағы әртүрлі әрекеттерді, соның ішінде ядро жаңартулары, жарамсыз кіру әрекеттері, өңделмеген қателер және ескірген API-ларды пайдалану сияқты әзірлеу ақпаратын жазу үшін қолданылады. Бұл журнал файлдарының пішімін логгерді баптайтын кез келген кеңейтім өзгерте алады, сондықтан сайтыңыздың журнал файлдарын жүктеп алып, қарап шығуды ұсынамыз; олар мына жерде орналасқан: `%s`."
COM_PRIVACY_CORE_CAPABILITY_SESSION_IP_ADDRESS_AND_COOKIE="Joomla сайтына жасалған барлық сұраулар сессияны бастайды: ол IP-мекенжайды сессия деректерінде сақтайды және пайдаланушы браузерінде сессия cookie-ін жасайды. IP-мекенжай ықтимал сессияны ұрлау шабуылдарынан қорғауға көмектесетін қауіпсіздік шарасы ретінде пайдаланылады, ал бұл ақпарат сессия мерзімі аяқталып, оның деректері тазартылғаннан кейін жойылады. Сессия cookie-інің атауы кездейсоқ жасалған хэшке негізделген, сондықтан тұрақты идентификаторы жоқ. Сессия cookie-і сессия мерзімі аяқталғанда немесе пайдаланушы браузерден шыққанда жойылады."
