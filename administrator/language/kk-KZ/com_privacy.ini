COM_PRIVACY_MSG_CAPABILITIES_INTRODUCTION="Бұл экрандағы ақпарат өздерінің жеке деректерге қатысты мүмкіндіктері туралы осы жүйеге хабарлайтын кеңейтімдерден жиналады. Ол сайт иелеріне орнатылған кеңейтімдердің мүмкіндіктерін білуге және құпиялылық саясаты сияқты сайттың жергілікті саясаттарын жасауға көмектесетін ақпарат беруге арналған. Бұл экран кеңейтімдердің есеп беру жүйесін қолдауын талап етеді және тек қосулы кеңейтімдердің ақпаратын көрсететіндіктен, оны толық тізім деп санамаңыз; қосымша ақпарат үшін әр кеңейтімнің құжаттамасын қарауды ұсынамыз."
