COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_MENUS_TITLE="Меню"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_MENUS_DESCRIPTION="<p>Меню әкімшілік басқару беттеріне қол жеткізуге мүмкіндік береді. Әр бөлімде Joomla-ның нақты бір аспектісін, мысалы, контентті, менюлерді және пайдаланушыларды басқаруға арналған беттер жиынтығы бар.</p><p>Терезе иконкалары осы бөлімдердің жеке тақталарына апарады. «Жүйе» менюінің өзі де тақтаға апарады.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_QUICKACCESS_TITLE="Басқару панелі"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_QUICKACCESS_DESCRIPTION="<p>Тақталар жиі пайдаланылатын беттерге иконкалар арқылы жылдам қол жеткізуге мүмкіндік береді.</p><p>Әр тақта панелі — «Баптаулар» иконкасы арқылы реттелетін әкімшілік модулі <span class=\"icon-cogs\" aria-hidden=\"true\"></span>.<br>Бұл сайт тақталарын өз мақсаттарыңызға сай баптауға мүмкіндік береді.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_NOTIFICATIONS_TITLE="Хабарландырулар панелі"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_NOTIFICATIONS_DESCRIPTION="<p>Хабарландырулар панелі Joomla мен басқа кеңейтімдерге жаңартулар болған кезде көрсетіледі. Орындалмаған жеке деректер сұраулары да осы жерде көрсетіледі.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_TOPBAR_TITLE="Жоғарғы жол"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_TOPBAR_DESCRIPTION="<p>Жоғарғы жол көрсетілген беттің атауын көрсетеді, сондықтан қайда екеніңізді әрқашан білесіз. Жоғарғы жолдағы басқа элементтер — міндетті емес модульдер.</p><p>Әдетте мұнда Joomla-ның ағымдағы нұсқасы мен қосымша оқыту турларына қол жеткізу орналасады.</p><p>Соңғы элементтер әдетте сайттың жария бөлігіне (фронтенд) сілтеме және тіркелгіні басқаруға және жүйеден шығуға болатын пайдаланушы менюі болады.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_FINALWORDS_TITLE="Көмек"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_FINALWORDS_DESCRIPTION="<p>Мұнда сізге көмектесетін көптеген ресурстар, сондай-ақ қосымша ресурстарға, құжаттамаға, қолдауға және Joomla жұмысына қатысу жолдарына сілтемелер бар.</p>"
