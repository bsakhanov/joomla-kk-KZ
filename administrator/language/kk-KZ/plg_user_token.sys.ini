PLG_USER_TOKEN="Пайдаланушы — Joomla API токені"
PLG_USER_TOKEN_ALLOWEDUSERGROUPS_DESC="Joomla пайдаланушылар топтарының қайсысына Joomla API қолданбасына аутентификациялау үшін Joomla токендерін пайдалануға рұқсат етіледі. Сондай-ақ қай пайдаланушылар топтарының өз профилінде Joomla токендерін басқару интерфейсін көретінін басқарады. Әдепкі: Joomla-ның кірістірілген «Супер пайдаланушылар» тобы (пайдаланушылар тобының ID-і 8)."
PLG_USER_TOKEN_ALLOWEDUSERGROUPS_LABEL="Рұқсат етілген пайдаланушы топтары"
PLG_USER_TOKEN_XML_DESCRIPTION="Joomla API қолданбасына (сайтыңызға қашықтан қолжетімділік) аутентификациялау үшін пайдаланылатын қауіпсіздік токендерін басқаруға мүмкіндік береді. Бұл токендер қатаң жеке болып табылады. Өз токеніңізді көре аласыз, ал басқа пайдаланушылардың токендерін тек өшіруге немесе қалпына келтіруге болады."
