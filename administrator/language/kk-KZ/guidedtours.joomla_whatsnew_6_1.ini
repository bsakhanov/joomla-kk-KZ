COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_DESCRIPTION="<h1 class=\"fw-medium\">Joomla 6.1-ге қош келдіңіз!</h1><p>Joomla 6.1 сайт құруды жеңілдететін, қауіпсіздеу және икемдірек ететін негізгі жақсартуларды ұсынады. Бұл тур маңыздысын бір қарауда көрсетеді.</p><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">Спамнан қорғау Proof-of-Work CAPTCHA арқылы ҚАЙТА ОРАЛДЫ</h2><p>Тіркелгі де, API де қажет емес, құпиялылықты сақтайды және қолжетімді: бұл captcha фонда математикалық жұмбақтарды үнсіз шешеді, келушілерге көрінбейді.</p><p>Қосу үшін <em>Кеңейтімдер</em> -&gt; <em>Плагиндер</em> бөліміне өтіп, <strong>captcha</strong> деп іздеңіз, қосыңыз және жалпы конфигурацияда әдепкі ретінде орнатыңыз.</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/captcha.jpg\" alt=\"Captcha тексеру және расталды күйлерін көрсетіп тұр\" width=\"600\" height=\"250\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/workflows.jpg\" alt=\"Негізгі үдеріске арналған графикалық кескін\" width=\"600\" height=\"350\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Контент үдерісі бір қарауда: көрнекі үдеріс редакторы</h2><p>Бүкіл жариялау үдерісін көруге мүмкіндік беретін жаңа интерактивті үдеріс диаграммасы арқылы контент үдерісін оңай басқарыңыз.</p><p><em>Мақалалар менеджері</em> -&gt; <em>Үдерістер</em> бөлімінде үдерістерді қосып, граф түймесін іздеңіз.</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Медиа өрісінің үш жаңа нұсқасы: аудио, бейне және құжаттар</h2><p>Контентке арналған арнайы өрістерді жасағанда, енді контент жасаушыларға тек суреттерді емес, кез келген медиа түрін қосуға мүмкіндік беруге болады.</p><p>Медиа HTML5 &lt;audio&gt;, &lt;video&gt; немесе құжатқа сілтеме (PDF, электрондық кестелер...) ретінде көрсетіледі.</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/media.jpg\" alt=\"Аудио, бейне және құжат медиа өрісінің үш нұсқасы\" width=\"600\" height=\"350\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-12 mb-3\"><h2 class=\"mb-3\">Нұсқалауы және көптілді байланыстары бар ақылды модульдер</h2><p>Joomla-да мақалалардың нұсқалар тарихы баяғыдан бар. Бұл мүмкіндік енді модульдерге де таратылды.<br>Көптілді сайт жүргізсеңіз, мақалаларды тілдер бойынша байланыстыратындай, енді модуль даналарын да әртүрлі тілдер бойынша байланыстыра аласыз.</p><h2>Атап өтуге тұрарлық басқа жақсартулар</h2><ul class=\"mb-3\"><li>TinyMCE мәтіндік редакторында <strong>&lt;abbr&gt;</strong> қысқартуын қолдау: семантикалық тұрғыдан дұрыс және қолжетімділікті жақсартады (контентті өңдегенде TinyMCE құралдар тақтасынан жаңа «Қысқарту» түймесін іздеңіз).</li><li>Тілді қайта анықтау күйі және жетіспейтін қайта анықтауларды жылдам жасау ыңғайлылығы жақсартылды (күй көрсеткіші, қайта анықтауларды оңай өңдеу).</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_TITLE="Joomla 6.1-дегі жаңалықтар!"
