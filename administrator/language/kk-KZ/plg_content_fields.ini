PLG_CONTENT_FIELDS="Контент — Өрістер"
PLG_CONTENT_FIELDS_XML_DESCRIPTION="<p>Бұл плагин «Түйме — Өрістер» плагині арқылы немесе {field #} синтаксисін тікелей редактор аймағына енгізу арқылы қойылған арнайы өрісті көрсетуге мүмкіндік береді.</p><p><strong>Мүмкін синтаксис:</strong></p><ul><li><code>{field 1}</code> ID-і 1 өрісті көрсетеді</li><li><code>{field 1,foo}</code> таңдалған өрісті «foo» балама макетін пайдаланып көрсетеді.</li><li><code>{fieldgroup 2}</code> ID-і 2 өріс тобындағы барлық өрістерді көрсетеді.</li></ul>"
