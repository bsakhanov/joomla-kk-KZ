LIB_PHPASS="PHPass"
LIB_PHPASS_XML_DESCRIPTION="PHP қосымшаларында пайдалануға арналған парольдерді хештеудің тасымалданатын жүйесі. PHPass қолдайтын ең қауіпсіз хештеу әдісі — OpenBSD стиліндегі BCrypt (PHP-де CRYPT_BLOWFISH ретінде белгілі), BSDI стиліндегі DES негізіндегі кеңейтілген хештерге (PHP-де CRYPT_EXT_DES ретінде белгілі) резервтік нұсқасы бар және соңғы шара ретінде PHPass-тың өзінде іске асырылған итерациялар санауышы бар MD5 негізіндегі парольді хештеу әдісіне қайтады."
