COM_PRIVACY_EMAIL_REQUEST_BODY_EXPORT_REQUEST="Біреу {URL} сайтында осы электрондық пошта мекенжайына қатысты барлық жеке ақпаратты экспорттау сұрауын жасады. Қауіпсіздік шарасы ретінде бұл сіздің жеке ақпаратыңызды осы сайттан алуға арналған жарамды сұрау екенін растауыңыз керек.\n\nБұл қате болса, осы хатты елемеңіз — ештеңе болмайды.\n\nСұрауды растау үшін мына әрекеттердің бірін орындаңыз:\n\n1. Мына URL-ға өтіңіз: {TOKENURL}\n\n2. Токенді осы хаттан көшіріп, көрсетілген URL-ға өтіп, токенді формаға қойыңыз.\nURL: {FORMURL}\nТокен: {TOKEN}\n\nЕскерту: бұл токен хат жіберілген сәттен бастап тек 24 сағат бойы жарамды."
COM_PRIVACY_EMAIL_REQUEST_BODY_REMOVE_REQUEST="Біреу {URL} сайтында осы электрондық пошта мекенжайына қатысты барлық жеке ақпаратты жою сұрауын жасады. Қауіпсіздік шарасы ретінде бұл сіздің жеке ақпаратыңызды осы сайттан жоюға арналған жарамды сұрау екенін растауыңыз керек.\n\nБұл қате болса, осы хатты елемеңіз — ештеңе болмайды.\n\nСұрауды растау үшін мына әрекеттердің бірін орындаңыз:\n\n1. Мына URL-ға өтіңіз: {TOKENURL}\n\n2. Токенді осы хаттан көшіріп, көрсетілген URL-ға өтіп, токенді формаға қойыңыз.\nURL: {FORMURL}\nТокен: {TOKEN}\n\nЕскерту: бұл токен хат жіберілген сәттен бастап тек 24 сағат бойы жарамды."
