JLIB_RULES_SETTING_NOTES="Әрекет мәндерінің өзгерістері осы және еншілес пайдаланушылар топтарына, компоненттерге және сайттың бүкіл мазмұнына қолданылады.<br><strong>Тыйым салынған</strong> кез келген мұраланған мәнді, сондай-ақ барлық еншілес топтардың, компоненттердің және мазмұнның мәндерін қайта анықтайды. Мәндер қайшы келсе, <strong>Тыйым салынған</strong> басым болады. <strong>Әрекет&#160;анықталмаған</strong> таңдалған әрекеттің жиынтық мәні <strong>Тыйым салынған</strong> ретінде қаралады, бірақ оны еншілес топтар, компоненттер, категориялар және элементтер үшін қайта анықтауға болады."
JLIB_RULES_SETTING_NOTES_ITEM="Әрекет мәндерінің өзгерістері тек осы элементке қолданылады.<br><strong>Мұраланған</strong> — сайттың жалпы баптауларындағы, ата-аналық пайдаланушылар тобындағы немесе категориядағы әрекет мәні қолданылады.<br><strong>Рұқсат етілген</strong> — егер сайттың жалпы баптауларындағы, ата-аналық пайдаланушылар тобындағы немесе категориядағы мәнмен қайшылық болмаса, топ пайдаланушылары элемент бойынша әрекетті орындай алады.<br><strong>Тыйым салынған</strong> — сайттың жалпы баптауларындағы, ата-аналық пайдаланушылар тобындағы немесе категориядағы мәнге қарамастан, топ пайдаланушылары элемент бойынша әрекетті орындай алмайды."
