name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to
        required: true
        default: "6.1.4.2"

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Check the pack
        run: python3 tools/kkpack.py check
      - name: Build the archives
        run: python3 tools/kkpack.py build
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/*.zip dist/SHA256SUMS --clobber
